"99" width="88" height="32" rx="9" fill="none" stroke="#E0D9C4" stroke-width="1" opacity="1"/><rect x="328" y="100" width="43" height="30" rx="8" fill="#F5C542" stroke="#F5C542" stroke-width="0" opacity="1"/><text x="306" y="121" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="middle" letter-spacing="0px" opacity="1">night</text><text x="349.5" y="121" font-family="Arial, sans-serif" font-size="11.5px" font-weight="700" fill="#17171b" text-anchor="middle" letter-spacing="0px" opacity="1">day</text><text x="16" y="178" font-family="Arial, sans-serif" font-size="12px" font-weight="600" fill="#8A8577" text-anchor="start" letter-spacing="2px" opacity="1">ON THE BIKE</text><rect x="16" y="190" width="376" height="196" rx="16" fill="#FFFFFF" stroke="#E0D9C4" stroke-width="1" opacity="1"/><text x="30" y="217" font-family="Arial, sans-serif" font-size="14px" font-weight="400" fill="#201F24" text-anchor="start" letter-spacing="0px" opacity="1">Red lights</text><text x="30" y="234" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="start" letter-spacing="0px" opacity="1">auto-pause is measured; button makes stop time self-reported</text><line x1="30" y1="248" x2="378" y2="248" stroke="#E0D9C4" stroke-width="1" opacity="1"/><rect x="256" y="203" width="116" height="32" rx="9" fill="none" stroke="#E0D9C4" stroke-width="1" opacity="1"/><rect x="265" y="204" width="34" height="30" rx="8" fill="#F5C542" stroke="#F5C542" stroke-width="0" opacity="1"/><text x="282" y="225" font-family="Arial, sans-serif" font-size="11.5px" font-weight="700" fill="#17171b" text-anchor="middle" letter-spacing="0px" opacity="1">auto</text><text x="320" y="225" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="middle" letter-spacing="0px" opacity="1">button</text><text x="371" y="225" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="middle" letter-spacing="0px" opacity="1">off</text><text x="30" y="275" font-family="Arial, sans-serif" font-size="14px" font-weight="400" fill="#201F24" text-anchor="start" letter-spacing="0px" opacity="1">Live map</text><text x="30" y="292" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="start" letter-spacing="0px" opacity="1">moving dot on the route while riding</text><line x1="30" y1="306" x2="378" y2="306" stroke="#E0D9C4" stroke-width="1" opacity="1"/><rect x="328" y="258" width="44" height="25" rx="25" fill="#F5C542" stroke="#F5C542" stroke-width="0" opacity="1"/><circle cx="359.5" cy="270.5" r="9.5" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="30" y="333" font-family="Arial, sans-serif" font-size="14px" font-weight="400" fill="#201F24" text-anchor="start" letter-spacing="0px" opacity="1">Earcons</text><text x="30" y="350" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="start" letter-spacing="0px" opacity="1">one buzz + tier sound at each gate (D-019)</text><rect x="328" y="316" width="44" height="25" rx="25" fill="#F5C542" stroke="#F5C542" stroke-width="0" opacity="1"/><circle cx="359.5" cy="328.5" r="9.5" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="16" y="402" font-family="Arial, sans-serif" font-size="12px" font-weight="600" fill="#8A8577" text-anchor="start" letter-spacing="2px" opacity="1">STARTING A RIDE</text><rect x="16" y="414" width="376" height="74" rx="16" fill="#FFFFFF" stroke="#E0D9C4" stroke-width="1" opacity="1"/><text x="30" y="443" font-family="Arial, sans-serif" font-size="14px" font-weight="400" fill="#201F24" text-anchor="start" letter-spacing="0px" opacity="1">Start place</text><text x="30" y="460" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="start" letter-spacing="0px" opacity="1">detect where you are, or pick it yourself (§21)</text><rect x="274" y="430" width="98" height="32" rx="9" fill="none" stroke="#E0D9C4" stroke-width="1" opacity="1"/><rect x="274" y="431" width="48" height="30" rx="8" fill="#F5C542" stroke="#F5C542" stroke-width="0" opacity="1"/><text x="298" y="452" font-family="Arial, sans-serif" font-size="11.5px" font-weight="700" fill="#17171b" text-anchor="middle" letter-spacing="0px" opacity="1">detect</text><text x="347" y="452" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="middle" letter-spacing="0px" opacity="1">choose</text><text x="16" y="506" font-family="Arial, sans-serif" font-size="12px" font-weight="600" fill="#8A8577" text-anchor="start" letter-spacing="2px" opacity="1">SCORING</text><rect x="16" y="518" width="376" height="74" rx="16" fill="#FFFFFF" stroke="#E0D9C4" stroke-width="1" opacity="1"/><text x="30" y="548" font-family="Arial, sans-serif" font-size="14px" font-weight="400" fill="#201F24" text-anchor="start" letter-spacing="0px" opacity="1">Rankings</text><text x="30" y="565" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="start" letter-spacing="0px" opacity="1">show where each ride placed against your others on that route</text><rect x="328" y="544" width="44" height="25" rx="25" fill="#F5C542" stroke="#F5C542" stroke-width="0" opacity="1"/><circle cx="359.5" cy="556.5" r="9.5" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="16" y="613" font-family="Arial, sans-serif" font-size="11.5px" font-weight="400" fill="#8A8577" text-anchor="start" letter-spacing="0px" opacity="1">Saved on the phone and restored on launch. A corrupt file falls back to these defaults.</text></g><g inkscape:groupmode="layer" inkscape:label="APP / TAB BAR" id="tab-bar"><rect x="0" y="829" width="408" height="71" rx="0" fill="#FAF7EE" stroke="none" stroke-width="1" opacity="1"/><line x1="0" y1="829" x2="408" y2="829" stroke="#E0D9C4" stroke-width="1" opacity="1"/>