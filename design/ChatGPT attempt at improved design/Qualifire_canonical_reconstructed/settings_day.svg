  <title>settings_day.svg</title>
  <metadata>Qualifire canonical reconstruction from current React Native source. Device frame 408×900; top inset modeled at 36 px from supplied Honor Magic7 Lite layout guide. Android bottom inset is modeled as 24 px; actual app uses SafeAreaContext dynamically.</metadata>
