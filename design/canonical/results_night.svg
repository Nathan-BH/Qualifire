<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <clipPath id="tabbar_viewport_clip">
      <rect x="0" y="790" width="390" height="54" />
    </clipPath>
  </defs>
  <g id="bg" inkscape:label="bg" inkscape:groupmode="layer">
