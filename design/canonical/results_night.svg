      <text id="content_row_2_sub" inkscape:label="content_row_2_sub" x="33" y="199.65" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#b5b3ac" text-anchor="start" style="font-variant-numeric:tabular-nums">best 15:03 · last Fri 21 Aug</text>
      <text id="content_row_2_rides" inkscape:label="content_row_2_rides" x="344" y="181.65" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#9a978f" text-anchor="end" style="font-variant-numeric:tabular-nums">6 rides</text>
