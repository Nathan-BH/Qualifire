  </g>
  <g id="content" inkscape:label="content" inkscape:groupmode="layer">
    <text id="content_title" inkscape:label="content_title" x="16" y="24" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#F4F2EC" text-anchor="start" letter-spacing="2" style="text-transform:uppercase">RESULTS</text>
    <text id="content_sport_badge" inkscape:label="content_sport_badge" x="16" y="58" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#b5b3ac" text-anchor="start" style="font-variant-numeric:tabular-nums">CYCLING</text>
    <g id="content_row_1" inkscape:label="content_row_1">
      <rect id="content_row_1_bg" inkscape:label="content_row_1_bg" x="16" y="84" width="358" height="63.65" fill="#212127" stroke="#41414c" stroke-width="1" rx="16" />
      <rect id="content_row_1_accent" inkscape:label="content_row_1_accent" x="16" y="84" width="3" height="63.65" fill="#F5C542" />
      <text id="content_row_1_title" inkscape:label="content_row_1_title" x="33" y="108" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#F4F2EC" text-anchor="start">Home Work Dry</text>
      <text id="content_row_1_sub" inkscape:label="content_row_1_sub" x="33" y="126" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#b5b3ac" text-anchor="start" style="font-variant-numeric:tabular-nums">best 13:58 · last Tue 01 Sep</text>
      <text id="content_row_1_rides" inkscape:label="content_row_1_rides" x="344" y="108" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#9a978f" text-anchor="end" style="font-variant-numeric:tabular-nums">10 rides</text>
      <text id="content_row_1_chev" inkscape:label="content_row_1_chev" x="358" y="108" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="400" fill="#9a978f" text-anchor="middle">›</text>
    </g>
