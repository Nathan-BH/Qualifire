    <text id="tabbar_results_label" inkscape:label="tabbar_results_label" x="322" y="824" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F2EC" text-anchor="middle" letter-spacing="2" style="text-transform:uppercase">RESULTS</text>
    <text id="tabbar_settings_label" inkscape:label="tabbar_settings_label" x="414" y="824" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a978f" text-anchor="middle" letter-spacing="2" style="text-transform:uppercase">SETTINGS</text>
    <text id="tabbar_demo_label" inkscape:label="tabbar_demo_label" x="506" y="824" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a978f" text-anchor="middle" letter-spacing="2" style="text-transform:uppercase">DEMO</text>
