<!doctype html>
<html><head><meta charset="utf-8"><title>Qualifire — app mockup</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0d0d0f; --card:#17171b; --line:#2b2b31; --ink:#f2f2f4; --dim:#8b8b96;
  --accent:#ffd400; --on-accent:#111; --purple:#b04ce6; --green:#2ec4b6; --amber:#ffb300;
}
body.day{--bg:#f4f4f6;--card:#fff;--line:#dcdce2;--ink:#16161a;--dim:#6b6b76;--on-accent:#111}
*{box-sizing:border-box}
body{margin:0;background:#000;font:15px/1.5 system-ui,-apple-system,sans-serif;color:var(--ink);
  display:flex;justify-content:center;padding:18px 10px 40px}
/* Fixed phone height so the SCREEN scrolls, not the page — otherwise the long
   tabs (routes, settings, result) ran off the bottom of the frame. */
.phone{width:390px;height:min(840px,94vh);background:var(--bg);border-radius:26px;overflow:hidden;
  display:flex;flex-direction:column;border:1px solid #222;position:relative}
.screen{flex:1 1 auto;min-height:0;padding:14px 15px 26px;overflow-y:auto;overscroll-behavior:contain}
.tabbar{flex:0 0 auto}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--card);
  overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar div{flex:0 0 auto;min-width:92px;text-align:center;padding:10px 0 12px;font-size:11px;
  letter-spacing:.6px;color:var(--dim);cursor:pointer;text-transform:uppercase}
.tabbar div.on{color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent)}
h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px}
button{font:inherit}
.btn{width:100%;border:none;border-radius:14px;padding:16px;font-size:20px;font-weight:800;
  letter-spacing:4px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.slim{padding:11px;font-size:15px;letter-spacing:3px;background:transparent;color:var(--amber);
  border:2px solid var(--amber);border-radius:11px}
.btn.flag{background:#d33;color:#fff;letter-spacing:2px;font-size:15px;padding:12px;margin-top:8px}
#map,#map2{height:190px;border-radius:12px;margin-bottom:10px;filter:saturate(.80)}
#map2{height:300px}
.clock{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;
  letter-spacing:-2px;line-height:1.05;margin:4px 0}
.flash{text-align:center;padding:6px 0}
.flash .lbl{font-size:12px;letter-spacing:3px;color:var(--dim)}
.flash .val{font-size:50px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.strip{display:flex;gap:7px;margin-top:10px}
.slot{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 3px;text-align:center;font-size:11px;color:var(--dim)}
.slot .t{display:block;font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.slot.cur{border-color:var(--accent)}
.tier-purple{color:var(--purple)!important;border-color:var(--purple)!important}
.tier-green{color:var(--green)!important;border-color:var(--green)!important}
.tier-neutral{color:var(--accent)!important}
.tier-yellow{color:#a5a52c!important}
.status{text-align:center;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-top:9px;min-height:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 7px;border-bottom:1px solid var(--line)}
.pos{width:38px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.t{text-align:right;font-variant-numeric:tabular-nums}
tr.ghost td{color:var(--dim)} tr.me td{color:var(--green);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .lab{font-size:14px}.row .hint{font-size:11.5px;color:var(--dim);margin-top:2px;max-width:250px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{background:transparent;border:none;color:var(--dim);padding:6px 9px;font-size:11.5px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.sw{width:44px;height:25px;border-radius:25px;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:19px;background:#888;transition:.15s}
.sw.on{background:var(--accent)} .sw.on i{left:22px;background:#fff}
.pill{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:4px 11px;font-size:12.5px;margin:0 6px 6px 0;cursor:pointer;color:var(--dim)}
.pill.on{border-color:var(--accent);color:var(--accent)}
.muted{color:var(--dim);font-size:12px}
.big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{display:inline-block;width:26px;height:9px;border-radius:5px;background:var(--dim)}
.bar.tier-purple{background:var(--purple)} .bar.tier-green{background:var(--green)}
.bar.tier-neutral{background:var(--accent)} .bar.bar-yellow{background:#8a8a20}
.lmtip{background:rgba(0,0,0,.72)!important;border:none!important;color:#fff!important;font-size:11px!important}
.lmtip:before{display:none}
.note{font-size:11.5px;color:var(--dim);border-left:2px solid var(--accent);padding-left:9px;margin-top:10px}
/* ride-history / result accordions (Nathan 2026-08-19 — replace "fixes" list
   and the fixed result board with expandable, human-readable rows) */
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--line);cursor:pointer}
.rowhead:last-child{border-bottom:none}
.rank{font-size:11px;letter-spacing:.5px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.rank b{color:var(--ink);font-variant-numeric:tabular-nums}
.chev{color:var(--dim);transition:transform .15s;flex:none}
.chev.open{transform:rotate(90deg)}
.detail{padding:4px 0 10px}
.badge{display:inline-block;font-size:10px;letter-spacing:.4px;text-transform:uppercase;
  border-radius:8px;padding:2px 7px;margin-left:6px;background:var(--purple);color:#fff}
/* record flow — RECORD replaces START; a "full screen" armed/running state */
.btn.record{background:#d33;color:#fff}
.btn.record:before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;
  background:#fff;margin-right:9px;vertical-align:-1px}
.armed-wrap{display:flex;flex-direction:column;height:100%}
.armed-map{flex:1 1 auto;min-height:0;border-radius:12px;overflow:hidden;margin-bottom:10px}
.readytag{text-align:center;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--dim);margin:2px 0 10px}
</style></head>
<body class="">
<!-- launch animation (Nathan 2026-08-17) — self-contained; do not fold into
     the styles/markup/script above. Mirrors app/src/ui/launchAnimation.tsx
     and the marketing hero's ratified choreography (marketing/index.html
     ~L88-107): ring draws clockwise from the 12-o'clock start tick, slash
     lands last, then the overlay fades to reveal the mockup underneath. -->
<style>
#qf-launch{position:absolute;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:#17171b;transition:opacity .25s ease;border-radius:26px;}
#qf-launch.qf-hide{opacity:0;pointer-events:none;}
#qf-launch .qf-mark{width:96px;height:96px;}
#qf-launch svg{width:100%;height:100%;display:block;}
/* Base = fully undrawn/hidden. Which way it plays is now a CLASS
   (.qf-anim-fwd / .qf-anim-rev) toggled by qfPlayLaunch() below, so the same
   mark can replay on RECORD (forward) and on END (reverse — Nathan
   2026-08-19: "the yellow line gets undrawn and then the circle gets
   undrawn as well"), not just once on cold launch. */
#qf-ring{stroke-dasharray:742;stroke-dashoffset:742;transform-origin:256px 218px;
  transform:rotate(-90deg);}
#qf-tail{stroke-dasharray:136;stroke-dashoffset:136;opacity:0;}
.qf-anim-fwd #qf-ring{animation:qf-draw-ring 1.4s cubic-bezier(.2,.7,.2,1) forwards;}
.qf-anim-fwd #qf-tail{animation:qf-draw-tail .5s ease-out forwards;animation-delay:1.15s;}
.qf-anim-rev #qf-tail{animation:qf-undraw-tail .5s ease-in forwards;}
.qf-anim-rev #qf-ring{animation:qf-undraw-ring 1.4s cubic-bezier(.2,.7,.2,1) both;animation-delay:.5s;}
@keyframes qf-draw-ring{to{stroke-dashoffset:0;}}
@keyframes qf-draw-tail{0%{stroke-dashoffset:136;opacity:1;}100%{stroke-dashoffset:0;opacity:1;}}
@keyframes qf-undraw-tail{0%{stroke-dashoffset:0;opacity:1;}100%{stroke-dashoffset:136;opacity:0;}}
@keyframes qf-undraw-ring{0%{stroke-dashoffset:0;}100%{stroke-dashoffset:742;}}
@media (prefers-reduced-motion: reduce){
  .qf-anim-fwd #qf-ring,.qf-anim-rev #qf-ring{animation:none!important;}
  .qf-anim-fwd #qf-tail,.qf-anim-rev #qf-tail{animation:none!important;}
}
</style>
<div class="phone">
  <div class="screen" id="screen"></div>
  <div class="tabbar" id="tabbar"></div>
  <div id="qf-launch" aria-hidden="true">

      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <circle id="qf-ring" cx="256" cy="218" r="118" fill="none" stroke="#F4F2EC" stroke-width="30" stroke-linecap="round"/>
        <line id="qf-tail" x1="291.355" y1="253.355" x2="387.5206" y2="349.5206" fill="none" stroke="#F5C542" stroke-width="30" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>
<script>
// launch animation (Nathan 2026-08-17, extended 2026-08-19): now a reusable
// window.qfPlayLaunch(reverse, onDone) instead of a fire-once-on-load IIFE,
// so RECORD (forward, mark draws) and END (reverse, mark undraws — tail
// first, then ring, per Nathan's note) can both replay it. Still plays once
// on cold launch, same as before. Reduced-motion shows the completed/blank
// mark, held briefly, then fades — no draw animation either direction.
(function(){
  var el = document.getElementById('qf-launch');
  var ring = document.getElementById('qf-ring');
  var tail = document.getElementById('qf-tail');
  function reduced(){ return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); }
  window.qfPlayLaunch = function(reverse, onDone){
    if(!el || !ring || !tail){ onDone && onDone(); return; }
    el.style.display='flex';
    el.classList.remove('qf-hide');
    // stop any animation-in-flight and force a reflow so replaying the same
    // class re-triggers the keyframes instead of being a no-op.
    ring.style.animation='none'; tail.style.animation='none';
    void ring.offsetWidth; void tail.offsetWidth;
    el.classList.remove('qf-anim-fwd','qf-anim-rev');
    if(reduced()){
      ring.style.strokeDashoffset = reverse ? '742' : '0';
      tail.style.strokeDashoffset = reverse ? '136' : '0';
      tail.style.opacity = reverse ? '0' : '1';
      setTimeout(function(){
        el.classList.add('qf-hide');
        setTimeout(function(){ el.style.display='none'; onDone && onDone(); }, 250);
      }, 300);
      return;
    }
    ring.style.animation=''; tail.style.animation='';
    ring.style.strokeDashoffset=''; tail.style.strokeDashoffset=''; tail.style.opacity='';
    void el.offsetWidth;
    el.classList.add(reverse ? 'qf-anim-rev' : 'qf-anim-fwd');
    var holdMs = reverse ? 1900 : 1650; // fwd: ring 1.4s + tail .15s delay + .5s = 1.65s; rev: tail .5s + ring .5s delay + 1.4s = 1.9s
    setTimeout(function(){
      el.classList.add('qf-hide');
      setTimeout(function(){ el.style.display='none'; onDone && onDone(); }, 250);
    }, holdMs);
  };
  qfPlayLaunch(false); // the cold-launch play, same as always
})();
</script>

const bestSectorFor = (arr,i) => Math.min(...arr.map(g=>g.sectors[i]).filter(v=>v!==null));
const avgSectorFor  = (arr,i) => { const v=arr.map(g=>g.sectors[i]).filter(x=>x!==null);
                          return v.reduce((a,b)=>a+b,0)/v.length; };
const sdSectorFor   = (arr,i) => { const v=arr.map(g=>g.sectors[i]).filter(x=>x!==null), a=avgSectorFor(arr,i);
                          return Math.sqrt(v.reduce((s,x)=>s+(x-a)**2,0)/v.length); };

/** The colour model is a SETTING here, so the unsettled §19 question can be
 *  felt rather than argued: 'best' = D-007/D-008 shape (beat the ghost best),
 *  'avg' = §19 (above/below the last-N average), 'hybrid' = avg ± 1σ deadband. */
function tierOfFor(arr, i, val){
  if(val===null || val===undefined) return 'est';
  if(S.colour==='best')  return val<bestSectorFor(arr,i) ? 'purple' : val<avgSectorFor(arr,i) ? 'green' : 'neutral';
  if(S.colour==='avg')   return val<bestSectorFor(arr,i) ? 'purple' : val<avgSectorFor(arr,i) ? 'green' : 'yellow';
  const sd=sdSectorFor(arr,i), a=avgSectorFor(arr,i);
  return val<bestSectorFor(arr,i) ? 'purple' : val<a-sd ? 'green' : val>a+sd ? 'yellow' : 'neutral';

  const avg = arr.reduce((a,g)=>a+g.movingS,0)/arr.length;
  const sd = Math.sqrt(arr.reduce((s,g)=>s+(g.movingS-avg)**2,0)/arr.length);
  if(mine<best) return 'purple';
  if(S.colour==='best') return mine<avg ? 'green':'neutral';
  if(S.colour==='avg')  return mine<avg ? 'green':'yellow';
  return mine<avg-sd ? 'green' : mine>avg+sd ? 'yellow' : 'neutral';
}
/** Where a ride's lap placed against its route's tower (last-up-to-10
 *  archive rides) — "P4 of 10", never a raw ride id. */
function rankInTower(ride){
  const tw = towerFor(ride.route);
  // Is this ride already one of the tower's own archive entries (matched by
  // id prefix, same as sectorsForRide)? If so rank it IN PLACE — don't also
  // add it as a new slot, or an archive ride would double-count itself.
  // Only a genuinely new session ride (id never matches a tower entry) adds
  // a slot. Tagged by IDENTITY, not by lap-time value: this mockup's one
  // live GPX replay literally IS an archived Morning ride, so an exact time
  // tie with that entry is expected — indexOf(value) would resolve the tie
  // to the archive slot even when asking for "my" position.
  const match = tw.find(g => ride.id.indexOf(g.id) === 0);
  const arr = tw.map(g => ({v:g.movingS, mine: g===match}));
  if(!match && ride.lapS!=null) arr.push({v:ride.lapS, mine:true});
  arr.sort((a,b)=>a.v-b.v);
  const idx = arr.findIndex(x=>x.mine);
  return {pos: ride.lapS!=null ? idx+1 : 0, of: arr.length};
}
/** Sector splits for a saved ride: recorded directly on session rides, or
 *  looked up from the matching tower entry (ids share the date-time prefix)
 *  for archive rides that only ship a lap total. */
function sectorsForRide(ride){
  if(ride.sectors) return ride.sectors;
  const m = towerFor(ride.route).find(g => ride.id.indexOf(g.id) === 0);
  return m ? m.sectors : null;
}
/** Personal-best lap for a route, across its tower AND anything ridden this
 *  session (a session ride can beat the archive). */
function bestLapFor(route){
  const arr = towerFor(route);
  const own = saved.concat(D.rides).filter(r=>r.route===route && r.lapS!=null).map(r=>r.lapS);
  const laps = arr.map(g=>g.movingS).concat(own);
  return laps.length ? Math.min(...laps) : null;
}

// ------------------------------------------------------------------ record
// Three screens in one tab (Nathan 2026-08-19):
//   setup   — pick from/to/route, press RECORD (was START)
//   armed   — the RACE screen: route + your location shown, nothing moving
//             yet, launch animation already played getting here, press START
//   running — the live ride (unchanged mechanics); END plays the animation
//             REVERSED, then drops you on Result
// armed + running are "full screen" — render() hides the tabbar for both.
function recordScreen(){
  const s = document.getElementById('screen');
  s.innerHTML = '';
  if(R.phase==='done') reset();   // a finished ride folds straight back to setup

  if(R.phase==='setup'){
    const pickable = D.landmarks.filter(l=>!l.dormant);
    const wayFor = (a,b) => D.ways.find(w=>(w.ai===a&&w.bi===b)||(w.ai===b&&w.bi===a));
    const w = wayFor(sel.from, sel.to);
    const n = w ? w.n : 0;
    const routes = w && w.routes && w.routes.length>1 ? w.routes : null;
    const pillRow = (which) => pickable.filter(l=>which==='from'||l.id!==sel.from)
      .map(l=>`<span class="pill${sel[which]===l.id?' on':''}" data-pick="${which}" data-id="${l.id}">${l.label}</span>`).join('');
    s.appendChild(el(`<div>
      <h2>Start</h2>
      <div class="card">
        ${S.startMode==='auto' && sel.picking!=='from'
          ? `<div class="muted">detected start</div>
             <div style="font-size:20px;font-weight:700">${lm(sel.from)}</div>
             <div class="muted" style="margin-top:6px">not right?
               <span class="pill" data-open="from">change</span></div>`
          : `<div class="muted">where are you starting?</div>
             <div style="margin-top:7px">${pillRow('from')}</div>`}
      </div>
      <div class="card">
        <div class="muted">going to</div>
        <div style="margin-top:7px">${pillRow('to')}</div>
        <div style="margin-top:9px;font-size:13px">
          ${n ? `<b>${n} rides found</b><span class="muted"> — ${lm(sel.from)} → ${lm(sel.to)}, you are racing ${n} ghosts</span>`
              : `<b>no rides yet</b><span class="muted"> — first time on this way, nothing to race</span>`}
        </div>
        ${routes ? `<div style="margin-top:10px"><div class="muted">which route today?</div>
          <div style="margin-top:6px">${routes.map((r,i)=>
            `<span class="pill${(sel.routePick||routes[0])===r?' on':''}" data-route="${r}">${r}</span>`).join('')}</div></div>`:''}
      </div>
      <button class="btn record" id="go">RECORD</button>
      <div class="note">${routes
        ? 'This way has more than one ratified route, so it asks (§8a). The pick is intent only — ride a different road and the ride scores as the road you actually took.'
        : 'One route on this way, so no extra step.'}
        The mockup replays the home → work commute whichever pair you choose.
        RECORD plays the launch mark, then the RACE screen is ready but not moving until you press START.</div>
    </div>`));
    document.getElementById('go').onclick = () => {
      qfPlayLaunch(false, () => { R.phase='armed'; render(); });
    };
    return;
  }

  if(R.phase==='armed'){
    s.appendChild(el(`<div class="armed-wrap">
      <div class="readytag">${lm(sel.from)} → ${lm(sel.to)}${sel.routePick?' · '+sel.routePick:''} · ready, not started</div>
      ${S.mapLive?'<div class="armed-map"><div id="map" style="height:100%"></div></div>':''}
      <button class="btn" id="realstart">START</button>
    </div>`));
    document.getElementById('realstart').onclick = start;
    if(S.mapLive) initMap();
    return;
  }

  // R.phase === 'running'
  s.appendChild(el(`<div>
    ${S.mapLive?'<div id="map"></div>':''}
    <div id="clockslot"></div>
    <div class="strip" id="strip"></div>
    <div class="status" id="status"></div>
    <button class="btn slim" id="end" style="margin-top:12px">END</button>
    ${S.redlight==='button'?'<button class="btn flag" id="flag">RED LIGHT — HOLD CLOCK</button>':''}
  </div>`));
  document.getElementById('end').onclick = finishRide;
  const fl = document.getElementById('flag');
  if(fl) fl.onclick = () => { R.paused=!R.paused; fl.textContent = R.paused?'GO — RELEASE CLOCK':'RED LIGHT — HOLD CLOCK'; };
  if(S.mapLive) initMap();
  paint();
}

function initMap(){
  if(map){ try{ map.remove(); }catch(err){} map=null; }   // armed→running re-creates the map div
  // B-51 (2026-08-17): the shipped app now renders this as MapLibre +
  // OpenFreeMap dark vector tiles, runtime-patched to strip labels and any
  // basemap colour that would read as a tier verdict (D-030 palette
  // firewall). It is also no longer pan/zoom-free like the Routes map below
  // — while actually moving it is locked heading-up, control-free, and
  // capped to the ribbon height; it only unlocks (pan/zoom, labels, a
  // visible zoom bar) before START, at a stop (also dimmed 0.4 — a light is
  // not a finish), and after FINISH. This mockup keeps its raster-OSM
  // stand-in rather than rebuilding onto MapLibre GL JS, so the pan/zoom
  // below stays free at every ride state here — caption only, per the B-51
  // acceptance brief ("do not rebuild the mockup").
  map = L.map('map',{attributionControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'\u00a9 OpenStreetMap contributors'}).addTo(map);
  const pts = D.sim.track.map(p=>[p[0],p[1]]);
  L.polyline(pts,{color:'#14120C',weight:9,opacity:.9}).addTo(map);  // casing (D-031)
  trail = L.polyline([],{color:'#F5C542',weight:5}).addTo(map);
  // The measured gates (D-016) — they turn the earned colour as you cross them.
  gateMarks = D.sim.gates.map(g =>
    L.circleMarker([g.lat,g.lon],{radius:6,color:'#14120C',weight:2,fillColor:'#E8E4DA',fillOpacity:1})
      .bindTooltip(g.name,{permanent:true,direction:'right',className:'lmtip'}).addTo(map));
  dot = L.circleMarker(pts[0],{radius:8,color:'#14120C',weight:3,fillColor:'#F5C542',fillOpacity:1}).addTo(map);
  // Tight crop that travels with the rider — a live view, not a route overview.
  map.setView(pts[0], 16);
  map.on('dragstart', ()=>{ follow=false; });
  // Leaflet sizes itself at creation; the container is one tick old here, so
  // without this the tiles can come up blank.
  setTimeout(()=>map.invalidateSize(), 0);
}

// Real START, pressed from the armed RACE screen — this is where the clock
// and gate-crossing actually begin (Nathan 2026-08-19: RECORD only arms it).
function start(){
  follow=true; R.phase='running'; R.running=true; R.startedAt=Date.now();
  render();
  timer = setInterval(()=>{
    if(!R.paused) R.t += 0.1*RATE;
    const gt = D.sim.gateTs, off = D.sim.startOffset;
    // gate crossings, in ride time (the START gate sits ~162 m in)
    while(R.gate < gt.length-1 && R.t >= off+gt[R.gate+1]){
      R.gate++;
      R.sectors.push(D.sim.sectors[R.gate-1]);
      R.flashIdx = R.gate-1; R.flashUntil = R.t + 2.5;
      if(R.gate === gt.length-1){ finishRide(); return; }
    }
    paint();
  }, 100);
}
const RATE = 25;           // 25× — a 14-minute commute plays in ~34 s

// END (crossing FINISH auto-triggers this too) — save the ride, then play the
// launch mark REVERSED (Nathan 2026-08-19: "the yellow line gets undrawn and
// then the circle gets undrawn as well") before landing on Result.
function finishRide(){
  clearInterval(timer);
  R.running=false; R.phase='done'; R.done=true;
  const lap = R.sectors.length ? R.sectors.reduce((a,b)=>a+b,0) : null;
  const clean = R.gate >= D.sim.gates.length-1;   // false only if END was pressed early
  saved.unshift({id:'today-'+Date.now(), ms:Date.now(), route:'Morning', lapS:lap,
    q: clean?'clean':'partial', n:R.sectors.length, saved:true, sectors:R.sectors.slice()});
  resultOpen = 'Morning';
  qfPlayLaunch(true, () => { tab='result'; render(); });
}

function paint(){
  const cs = document.getElementById('clockslot'); if(!cs) return;
  const flashing = R.t < R.flashUntil && R.flashIdx>=0;
  if(flashing){
    const v = D.sim.sectors[R.flashIdx], t = tierOf(R.flashIdx, v);
    cs.innerHTML = `<div class="flash"><div class="lbl">S${R.flashIdx+1}</div>
      <div class="val ${tierClass(t)}">${f1(v)}</div></div>`;
  } else {
    cs.innerHTML = `<div class="clock">${f1(Math.max(0,R.t))}</div>`;
  }
  document.getElementById('strip').innerHTML = D.sim.sectors.map((v,i)=>{
    const done = i < R.gate;
    const t = done ? tierOf(i,v) : '';
    return `<div class="slot ${i===R.gate?'cur':''} ${done?tierClass(t):''}">S${i+1}
      ${done?`<span class="t">${f(v)}</span>`:'<span class="t">–</span>'}</div>`;
  }).join('');
  // Rotate on REAL seconds, not ride-clock seconds — at 25× the ride clock the
  // line was changing every ~0.25 s. One item per 10 s, and a line that just
  // changed (the route lock) holds the slot rather than waiting its turn.
  const st = document.getElementById('status');
  const locked = R.gate>0 || R.t>D.sim.startOffset;
  // No raw "N fixes" count here any more (Nathan 2026-08-19: "I dont know
  // what fixes are" — GPS fixes are an internal/diagnostic term, not
  // something to surface on the live status line; they still get written
  // to the GPX+ sidecar for troubleshooting, just not shown here).
  const items = locked ? [(sel.routePick||'route')+' · route locked', 'gps live']
                       : ['detecting route…','gps live'];
  if(locked && !R.lockPinAt) R.lockPinAt = Date.now();
  const realS = (Date.now() - R.startedAt)/1000;
  const pinned = R.lockPinAt && Date.now()-R.lockPinAt < 8000;
  st.textContent = R.paused ? 'clock held — red light'
                 : pinned ? items[0]
                 : items[Math.floor(realS/10)%items.length];
  if(map){
    const tr = D.sim.track;
    let i = 0; while(i<tr.length-1 && tr[i][2] < R.t) i++;
    dot.setLatLng([tr[i][0],tr[i][1]]);
    trail.setLatLngs(tr.slice(0,i+1).map(p=>[p[0],p[1]]));
    gateMarks.forEach((gm,k)=>{
      if(k===0) return gm.setStyle({fillColor: R.t>D.sim.startOffset ? '#ffd400':'#444'});
      const done = k<=R.gate;
      const tc = done ? tierOf(k-1, D.sim.sectors[k-1]) : null;
      gm.setStyle({fillColor: !done ? '#444'
        : tc==='purple'?'#b04ce6': tc==='green'?'#2ec4b6': tc==='yellow'?'#8a8a20':'#ffd400'});
    });
    if(follow) map.setView([tr[i][0],tr[i][1]], map.getZoom(), {animate:false});
  }
}

// ------------------------------------------------------------------ result
// Redesigned 2026-08-19 (Nathan: "just a fixed result… not appealing nor
// useful"). RESULT is now "how am I doing", route by route: your last ride
// up top, then a Personal Bests row PER ROUTE you click to expand into that
// route's ranking + best sectors — filterable/browsable rather than one
// frozen board, and no raw ride ids (RIDES tab owns the chronological log —
// see below — so the split stays: RIDES = what happened, RESULT = how you
// compare).
function resultScreen(){
  const routesAvail = ['Morning','EveningA','EveningB','MorningB'].filter(r=>towerFor(r).length);
  const latest = saved[0] || null;
  if(resultOpen===undefined) resultOpen = (latest && latest.route) || routesAvail[0];

  const latestBlock = latest ? (()=>{
    const tier = lapTierFor(latest.route, latest.lapS);
    // A ride ended early (END pressed before FINISH) has no lap total to
    // rank — "P0 of 9" would read as a real rank, so say so instead.
    const rankLine = latest.lapS!=null
      ? (()=>{ const rk=rankInTower(latest); return `P${rk.pos} of ${rk.of} on this route`; })()
      : 'ended early — no full lap to rank';
    return `<h2>Your last ride</h2>
      <div class="card" style="text-align:center">
        <div class="muted">${ROUTE_LABEL[latest.route]||latest.route}</div>
        <div class="big ${tierClass(tier)}">${latest.lapS!=null?f1(latest.lapS):'–'}</div>
        <div class="muted">${rankLine}</div>
        <button class="btn slim" style="margin-top:12px" onclick="tab='record';render()">RECORD ANOTHER</button>
      </div>`;
  })() : `<h2>Your last ride</h2><div class="card muted">Record a ride to see it here.</div>`;

  const bestRows = routesAvail.map(route=>{
    const pb = bestLapFor(route);
    const open = resultOpen===route;
    return `<div class="rowhead" data-resopen="${route}">
        <div><div class="lab">${ROUTE_LABEL[route]||route}</div>
          <div class="hint">personal best ${pb!=null?f1(pb):'–'} · ${towerFor(route).length} rides on file</div></div>
        <div class="chev ${open?'open':''}">›</div>
      </div>
      ${open?resultDetail(route):''}`;
  }).join('');

  document.getElementById('screen').innerHTML = `
    ${latestBlock}
    <h2>Personal bests — tap a route</h2>
    <div class="card">${bestRows}</div>
    <div class="note">Position is a fact (you were 4th of 10); colour is a judgement — D-013 keeps
      them apart, so a mid-pack position is never dressed as failure. Colours follow the
      <b>${S.colour==='best'?'current model (beat the best)':S.colour==='avg'?'§19 model (above/below the average)'
        :'hybrid (average ± 1σ deadband)'}</b> — switch it in Settings and watch the same rides change verdict.
      The shipped Result screen also has a "VIEW TRACE ›" link (B-57) that opens a route on a real-street
      browse map with the ride's gate colours — not modelled in this mockup.</div>`;
}

/** The expanded detail under a Personal Bests row: ranking (dates, not ids)
 *  and that route's best sector split. */
function resultDetail(route){
  const arr = towerFor(route);
  const own = saved.filter(r=>r.route===route).map(r=>({id:r.id, v:r.lapS, me:true}));
  const rows = arr.map(g=>({id:g.id, v:g.movingS, me:false})).concat(own)
    .filter(r=>r.v!=null).sort((a,b)=>a.v-b.v);
  const pole = rows.length ? rows[0].v : null;
  const nSec = arr[0] ? arr[0].sectors.length : 0;
  const pbSectors = Array.from({length:nSec}, (_,i)=>{
    const vals = arr.map(g=>g.sectors[i]).filter(v=>v!=null);
    return vals.length ? Math.min(...vals) : null;
  });
  return `<div class="detail">
    ${rows.length?`<div class="hint" style="margin-bottom:2px">last ${rows.length} on this route</div>
      <table>${rows.map((r,i)=>`<tr class="${r.me?'me':'ghost'}">
        <td class="pos">P${i+1}</td><td>${r.me?'you':shortDate(r.id)}</td>
        <td class="t">${f(r.v)}</td>
        <td class="t muted">${i===0?'':'+'+(r.v-pole).toFixed(0)+'s'}</td></tr>`).join('')}</table>`
      : `<div class="muted" style="padding:6px 0">no rides on file yet</div>`}
    ${nSec?`<div class="hint" style="margin:10px 0 4px">personal best sectors</div>
      <table>${pbSectors.map((v,i)=>`<tr><td class="pos">S${i+1}</td>
        <td class="t">${v!=null?f1(v):'–'}</td></tr>`).join('')}</table>`:''}
  </div>`;
}

// ------------------------------------------------------------------- rides

// ------------------------------------------------------------------ routes
function routesScreen(){
  const w = sel.way && D.ways.find(x=>x.id===sel.way);
  document.getElementById('screen').innerHTML = `
    <h2>Your places</h2><div id="map2"></div>
    <h2>Ways you ride</h2>
    <div class="card">${D.ways.map(x=>`<div class="row" data-way="${x.id}" style="cursor:pointer"><div>
      <div class="lab">${x.a} ↔ ${x.b}</div><div class="hint">${x.n} kept rides${
        x.routes&&x.routes.length>1?' · '+x.routes.length+' routes':''}</div></div>
      <div class="muted">${sel.way===x.id?'▾':'›'}</div></div>
      ${sel.way===x.id?`<div class="card" style="margin:8px 0 2px;background:transparent">
        <div class="muted" style="font-size:12px">routes on this way</div>
        ${(x.routes&&x.routes.length?x.routes:['(one route — not split)']).map(r=>
          `<span class="pill${r===(x.routes||[])[0]?' on':''}">${r}</span>`).join('')}
        <div class="hint" style="margin-top:8px">${x.n} rides you kept after review;
          ignored ones (roadworks detours, bad traces) are excluded and never become a benchmark.</div>
        <div class="hint" style="margin-top:6px">Gates: 4 sectors, START ~160 m in.
          Moving them is what §22 is about — a middle gate is cheap, a start or finish gate resets lap history.</div>
      </div>`:''}`).join('')}</div>
    <div class="note">Only places you ratified appear here; the family home is kept for history but is
      never offered as a destination. Tap a way to see its routes. In the shipped app (B-51) each route
      also renders as its own pannable real-street map (MapLibre/OpenFreeMap, uncoloured gate rings, no
      rider) in place of the old static route image — this mockup still shows only the places overview
      map above.</div>`;
  // Draggable, zoomable map of the six ratified places: yellow disc = the
  // landmark's real radius, grey = dormant. Zoom controls ON here (unlike the
  // ride map, which is inert by D-006).
  const m2 = L.map('map2',{attributionControl:true}).setView([50.855,4.66],12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(m2);
  const g=[];
  D.landmarks.forEach(l=>{
    const c=L.circle([l.lat,l.lon],{radius:l.radiusM,color:l.dormant?'#888':'#ffd400',
      weight:2,fillOpacity:.15}).addTo(m2);

      {permanent:true,direction:'top',className:'lmtip'});
    g.push(c);
  });
  try { m2.fitBounds(L.featureGroup(g).getBounds().pad(0.15)); } catch(err){}
  setTimeout(()=>m2.invalidateSize(), 0);
}

function settingsScreen(){
  document.getElementById('screen').innerHTML = `
    <h2>Appearance</h2>
    <div class="card"><div class="row"><div><div class="lab">Theme</div>
      <div class="hint">race surface follows it</div></div>${seg('theme',[['night','night'],['day','day']])}</div></div>

    <h2>On the bike</h2>
    <div class="card">
      <div class="row"><div><div class="lab">Red lights</div>
        <div class="hint">auto-pause is measured and untouchable; a button is yours to press but makes
        stopped time self-reported (§18, unsettled)</div></div>
        ${seg('redlight',[['auto','auto'],['button','button'],['off','off']])}</div>
      <div class="row"><div><div class="lab">Live map</div>
        <div class="hint">real MapLibre/OpenFreeMap dark tiles: pannable before you start, locked
        heading-up while riding, dims at a light, releases at finish</div></div>${sw('mapLive')}</div>
      <div class="row"><div><div class="lab">Earcons</div>
        <div class="hint">one buzz + tier sound at each gate (D-019)</div></div>${sw('earcons')}</div>
    </div>

    <h2>Starting a ride</h2>
    <div class="card"><div class="row"><div><div class="lab">Start place</div>
      <div class="hint">detect where you are, or pick it yourself (§21)</div></div>
      ${seg('startMode',[['auto','detect'],['pick','choose']])}</div></div>

    <h2>Scoring</h2>
    <div class="card">
      <div class="row"><div><div class="lab">Colour model</div>
        <div class="hint">SETTLED (D-030): purple beats the window best, green above the recent
        average, yellow an ordinary lap. No longer a choice.</div></div>
        <div class="muted">fixed</div></div>
      <div class="row"><div><div class="lab">Timing tower</div>
        <div class="hint">rank today against the ghost set</div></div>${sw('tower')}</div>
    </div>
    <div class="note">Everything here is a real switch in this mockup — change it, then record a ride
      (Record tab) and look at the Result tab. Nothing is saved; reload restores the defaults.</div>`;
}

// --------------------------------------------------------------------- demo
function demoScreen(){
  document.getElementById('screen').innerHTML = `
    <h2>Demo ride</h2>
    <div class="card">
      <div class="muted">One thing only: a real archived Morning lap replayed at 25x, through the
      same pane and map the Record tab uses. Buzz at every gate, tier colours as they are earned,
      the dot following the road actually ridden. Nothing is recorded.</div>
      <div class="note">In the app this is where the tier tones will play first, once audio
      assets exist. Today gates buzz and stay silent.</div>
    </div>
    <button class="btn" onclick="tab='record';render()">GO TO RECORD TO TRY IT</button>`;
}

// -------------------------------------------------------------------- shell
function render(){
  // The armed/running RACE screen is "full screen" (Nathan 2026-08-19): the
  // tabbar disappears so there's no browsing away mid-ride, and reappears
  // the moment you're back on setup or another tab.
  const fullscreen = tab==='record' && (R.phase==='armed' || R.phase==='running');
  const tb = document.getElementById('tabbar');
  tb.style.display = fullscreen ? 'none' : '';
  tb.innerHTML = TABS.map(([k,l])=>`<div class="${k===tab?'on':''}" data-tab="${k}">${l}</div>`).join('');
  if(tab==='record') recordScreen();
  else if(tab==='rides') ridesScreen();
  else if(tab==='routes') routesScreen();
  else if(tab==='result') resultScreen();
  else if(tab==='settings') settingsScreen();
  else demoScreen();   // bug fix: the old chain's final `else` always hit
                        // settingsScreen(), so the Demo tab was unreachable
}
function toast(msg){
  const t=document.getElementById('toast');
  if(t){ t.style.display='block'; t.textContent=msg; }
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-tab]');
  if(t){ // the tabbar is hidden during armed/running so this is a safety net,
         // not the normal path — abandoning mid-ride resets to setup.
         if(tab==='record' && R.phase!=='setup'){ clearInterval(timer); reset(); }
         tab=t.dataset.tab; render(); return; }
  const b = e.target.closest('[data-k]');
  if(b){ S[b.dataset.k]=b.dataset.v;
    document.body.className = S.theme==='day'?'day':''; render(); return; }
  const s = e.target.closest('[data-t]');
  if(s){ S[s.dataset.t]=!S[s.dataset.t]; render(); return; }
  const p = e.target.closest('[data-pick]');
  if(p){ sel[p.dataset.pick]=p.dataset.id; sel.picking=null;
    if(sel.to===sel.from) sel.to = (D.landmarks.find(l=>!l.dormant&&l.id!==sel.from)||{}).id;
    sel.way=null; render(); return; }
  const o = e.target.closest('[data-open]');
  if(o){ sel.picking=o.dataset.open; render(); return; }
  const rt = e.target.closest('[data-route]');
  if(rt){ sel.way=null; sel.routePick=rt.dataset.route; render(); return; }
  const w = e.target.closest('[data-way]');
  if(w){ sel.way = sel.way===w.dataset.way ? null : w.dataset.way; render(); return; }
  const rx = e.target.closest('[data-expand]');
  if(rx){ rideOpen = rideOpen===rx.dataset.expand ? null : rx.dataset.expand; render(); return; }
  const ro = e.target.closest('[data-resopen]');
  if(ro){ resultOpen = resultOpen===ro.dataset.resopen ? null : ro.dataset.resopen; render(); return; }
  const ex = e.target.closest('[data-export]');
  if(ex){ const all=saved.concat(D.rides), r=all[+ex.dataset.export];
    toast('would write qualifire-'+new Date(r.ms).toISOString().slice(0,10).replace(/-/g,'')+'.gpx to Downloads'); return; }
  const dl = e.target.closest('[data-del]');
  if(dl){ const i=+dl.dataset.del;
    if(i<saved.length){ saved.splice(i,1); render(); toast('ride deleted'); }
    else toast('archive rides are not deletable here — they are your seed history'); return; }
});
render();
</script></body></html>
