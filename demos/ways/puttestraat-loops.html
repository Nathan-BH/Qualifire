    +(OUT(r)?'#777':r.col)+'"></span>'+r.when+' · '+r.dir+' · '+r.min+' min'
    +(r.status!=='keep'?' <span class="tag">'+r.status+'</span>':'');
  el.onclick=()=>{ el.classList.toggle('off');
    if(map.hasLayer(lines[i])) map.removeLayer(lines[i]); else lines[i].addTo(map); };
  list.appendChild(el);
});
</script></body></html>
