<style>

let route = Object.keys(DATA)[0];
const f = s => Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const tabs = document.getElementById('tabs');
Object.keys(DATA).forEach(k=>{
  const b=document.createElement('div'); b.className='tab'+(k===route?' on':''); b.textContent=k;
  b.onclick=()=>{route=k;[...tabs.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');reset();};
  tabs.appendChild(b);
});
const sl=document.getElementById('sl');
function reset(){
  const g=DATA[route]; const lo=Math.floor(g[0].movingS-90), hi=Math.ceil(g[g.length-1].movingS+90);
  sl.min=lo; sl.max=hi; sl.value=Math.round((lo+hi)/2); draw();
}
function draw(){
  const mine=+sl.value, g=DATA[route];
  document.getElementById('lap').textContent=f(mine);
  const rows=g.map(x=>({...x,me:false})).concat([{id:'TODAY',movingS:mine,q:'clean',me:true}])
             .sort((a,b)=>a.movingS-b.movingS);
  const pole=rows[0].movingS;
  document.getElementById('tower').innerHTML=rows.map((r,i)=>
    '<tr class="'+(r.me?'me':'ghost')+(i===0?' p1':'')+'"><td class="pos">P'+(i+1)+'</td>'+
    '<td><span class="dot"></span>'+(r.me?'TODAY':r.id.slice(0,13))+
      (r.q==='interrupted'?' &#8214;':'')+'</td>'+
    '<td class="t">'+f(r.movingS)+'</td>'+
    '<td class="t gap">'+(i===0?'':'+'+(r.movingS-pole).toFixed(0)+'s')+'</td></tr>').join('');
  const p=rows.findIndex(r=>r.me)+1;
  document.getElementById('note').textContent =
    'P'+p+' of '+rows.length+' — '+(p===1?'pole of the ghost set: this lap beats every archived ride on this route.'
    :'the ghosts are marked; a seeded lap can hold pole until a real ride beats it, and D-024 keeps them demotable.');
}
sl.oninput=draw; reset();
