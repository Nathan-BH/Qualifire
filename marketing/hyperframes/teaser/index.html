<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Qualifire — brand teaser (HyperFrames)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; }
  * { box-sizing: border-box; }

  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #0A0A0A;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #F4F2EC;
  }

  .clip { position: absolute; }

  /* ---- track 0: logo mark (ring + slash) ---- */
  #mark {
    top: 50%;
    left: 50%;
    width: 400px;
    height: 400px;
    margin: -200px 0 0 -200px;
    transform-origin: center center;
  }
  #mark svg { width: 100%; height: 100%; display: block; }

  /* ---- track 1: wordmark + tagline ---- */
  #wordmark {
    top: 50%;
    left: 0;
    width: 1920px;
    text-align: center;
    transform: translateY(-40px);
    opacity: 0;
  }
  #wordmark .word {
    font-size: 96px;
    font-weight: 800;
    letter-spacing: 22px;
    color: #F4F2EC;
    margin: 0 0 22px 0;
    opacity: 0;
  }
  #wordmark .tagline {
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 1px;
    color: #9a978f;
    margin: 0;
    opacity: 0;
  }

  /* ---- track 2: sector slots ---- */
  #sectors {
    top: 640px;
    left: 0;
    width: 1920px;
    display: flex;
    justify-content: center;
    gap: 40px;
    opacity: 0;
  }
  .sector {
    width: 360px;
    height: 220px;
    border-radius: 18px;
    border: 3px solid #232323;
    background: #141414;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
  }
  .sector .s-label {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #9a978f;
    text-transform: uppercase;
  }
  .sector .s-time {
    font-size: 64px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    color: #F4F2EC;
  }

  /* ---- track 3: timing tower line ---- */
  #tower {
    top: 50%;
    left: 0;
    width: 1920px;
    text-align: center;
    transform: translateY(-30px);
    opacity: 0;
  }
  #tower .tower-pos {
    display: block;
    font-size: 160px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #F5C542;
    line-height: 1;
    margin: 0 0 18px 0;
    opacity: 0;
  }
  #tower .tower-desc {
    display: block;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 1px;
    color: #9a978f;
    opacity: 0;
  }

  /* ---- track 4: endcard wordmark ---- */
  #endcard {
    top: 660px;
    left: 0;
    width: 1920px;
    text-align: center;
    opacity: 0;
  }
  #endcard .endword {
    font-size: 84px;
    font-weight: 800;
    letter-spacing: 24px;
    color: #F5C542;
    margin: 0;
    opacity: 0;
  }

  /* logo mark starts undrawn: ring hidden by dash-offset (set in JS), slash hidden */
  #slash { opacity: 0; }
</style>
</head>
<body>

<div id="stage" data-composition-id="teaser" data-start="0" data-width="1920" data-height="1080">

  <!-- track 0 — logo mark: ring draws clockwise + slash lands (0-2s), shrinks to a
       corner badge while the wordmark/sectors/tower play, grows back centered for
       the endcard (9.8-12s). Geometry inlined from
       product/brand/logos/qualifire_logo_5_monogram_wordmark.svg (ring cx/cy/r,
       slash x1/y1/x2/y2 — unscaled, same 512x512 viewBox). -->
  <div id="mark" class="clip" data-start="0" data-duration="12" data-track-index="0">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <circle id="ring" cx="256" cy="218" r="118" fill="none" stroke="#F4F2EC"
        stroke-width="30" stroke-linecap="round" transform="rotate(-90 256 218)"/>
      <line id="slash" x1="291.355" y1="253.355" x2="387.5206" y2="349.5206"
        fill="none" stroke="#F5C542" stroke-width="30" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- track 1 — wordmark + tagline (2-5s) -->
  <div id="wordmark" class="clip" data-start="2" data-duration="3" data-track-index="1">
    <p class="word">QUALIFIRE</p>
    <p class="tagline">The commute, reframed as a qualifying lap.</p>
  </div>

  <!-- track 2 — four sector slots fill in sequence, yellow -> green -> yellow -> purple (5-9s) -->
  <div id="sectors" class="clip" data-start="5" data-duration="4" data-track-index="2">
    <div class="sector" id="s1"><span class="s-label">S1</span><span class="s-time">38.2</span></div>
    <div class="sector" id="s2"><span class="s-label">S2</span><span class="s-time">1:02.9</span></div>
    <div class="sector" id="s3"><span class="s-label">S3</span><span class="s-time">27.7</span></div>
    <div class="sector" id="s4"><span class="s-label">S4</span><span class="s-time">51.0</span></div>
  </div>

  <!-- track 3 — timing-tower line (9-10.6s) -->
  <div id="tower" class="clip" data-start="9" data-duration="1.6" data-track-index="3">
    <span class="tower-pos">P2</span>
    <span class="tower-desc">of your last 10 commutes</span>
  </div>

  <!-- track 4 — yellow QUALIFIRE endcard, plays under the regrown mark (10.6-12s) -->
  <div id="endcard" class="clip" data-start="10.6" data-duration="1.4" data-track-index="4">
    <p class="endword">QUALIFIRE</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    // One paused, seekable GSAP timeline for the whole composition — no
    // wall-clock animation, everything driven by absolute-time tweens so the
    // HyperFrames renderer can seek to any frame deterministically.
    var RING_R = 118;
    var CIRC = 2 * Math.PI * RING_R; // ~741.42

    gsap.set('#ring', { strokeDasharray: CIRC });

    var tl = gsap.timeline({ paused: true });

    // 0-2s — ring draws clockwise from the start tick, slash lands last
    tl.fromTo('#ring',
      { strokeDashoffset: CIRC },
      { strokeDashoffset: 0, duration: 1.3, ease: 'power2.inOut' }, 0);
    tl.fromTo('#slash',
      { opacity: 0 },
      { opacity: 1, duration: 0.35, ease: 'power1.out' }, 1.3);

    // mark shrinks to a small corner badge once the wordmark takes over
    tl.to('#mark',
      { x: -700, y: -380, scale: 0.22, duration: 0.6, ease: 'power2.inOut' }, 2.0);

    // 2-5s — wordmark + tagline
    tl.set('#wordmark', { opacity: 1 }, 2.0);
    tl.fromTo('#wordmark .word',
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 2.0);
    tl.fromTo('#wordmark .tagline',
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 2.25);
    tl.to('#wordmark', { opacity: 0, duration: 0.35 }, 4.65);

    // 5-9s — sectors fill in sequence: yellow, green, yellow, purple. Border and
    // number colour are tweened directly (not toggled via a CSS class) so a
    // renderer that seeks straight to a mid-sequence frame still resolves the
    // right colour — no reliance on an onStart callback having fired.
    var SECTOR_COLORS = ['#F5C542', '#3ED598', '#F5C542', '#A667F0'];
    var NEUTRAL_BORDER = '#232323';
    var NEUTRAL_TEXT = '#F4F2EC';
    tl.set('#sectors', { opacity: 1 }, 5.0);
    ['#s1', '#s2', '#s3', '#s4'].forEach(function (sel, i) {
      var t = 5.0 + i;
      var tier = SECTOR_COLORS[i];
      tl.fromTo(sel,
        { opacity: 0, y: 16, borderColor: NEUTRAL_BORDER },
        { opacity: 1, y: 0, borderColor: tier, duration: 0.35, ease: 'back.out(1.6)' }, t);
      tl.fromTo(sel + ' .s-time',
        { color: NEUTRAL_TEXT },
        { color: tier, duration: 0.35, ease: 'back.out(1.6)' }, t);
    });
    tl.to('#sectors', { opacity: 0, duration: 0.3 }, 8.7);

    // 9-10.6s — timing tower: "P2 - of your last 10 commutes"
    tl.set('#tower', { opacity: 1 }, 9.0);
    tl.fromTo('#tower .tower-pos',
      { opacity: 0, scale: 0.85 },
      { opacity: 1, scale: 1, duration: 0.4, ease: 'power2.out' }, 9.0);
    tl.fromTo('#tower .tower-desc',
      { opacity: 0 },
      { opacity: 1, duration: 0.4 }, 9.25);
    tl.to('#tower', { opacity: 0, duration: 0.3 }, 10.3);

    // 9.8-12s — mark grows back to centre, endcard wordmark fades in yellow
    tl.to('#mark', { x: 0, y: 0, scale: 1, duration: 1.0, ease: 'power2.inOut' }, 9.8);
    tl.set('#endcard', { opacity: 1 }, 10.6);
    tl.fromTo('#endcard .endword',
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 10.7);

    window.__timelines = window.__timelines || {};
    window.__timelines.teaser = tl;
  </script>

</div>

</body>
</html>
