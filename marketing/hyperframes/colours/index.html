<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Qualifire — Why purple is rare (HyperFrames)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; }
  * { box-sizing: border-box; }

  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #0A0A0A;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #F4F2EC;
  }

  .clip { position: absolute; }
  .clip.full { top: 0; left: 0; width: 1920px; height: 1080px; }
  .clip .inner { opacity: 0; }

  /* first beat starts drawing immediately, so it starts visible */
  #chart .inner { opacity: 1; }

  svg.full-svg { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; display: block; }

  .caption {
    position: absolute; top: 920px; left: 0; width: 1920px; margin: 0; text-align: center;
    font-size: 44px; font-weight: 600; letter-spacing: 0.5px; color: #F4F2EC; opacity: 0; line-height: 1.3;
  }
  .caption.second { top: 985px; }
  .caption.tier { top: 900px; font-size: 56px; }
</style>
</head>
<body>

<div id="stage" data-composition-id="purple" data-start="0" data-width="1920" data-height="1080">

  <!-- Beats 1-4 (0-19s): the chart. Vertical position = speed, higher = faster. -->
  <div id="chart" class="clip full" data-start="0" data-duration="19" data-track-index="1">
    <div class="inner">
      <svg class="full-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <line class="bar" id="b1" x1="700" x2="1220" y1="300" y2="300" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />
        <line class="bar" id="b2" x1="700" x2="1220" y1="372" y2="372" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />
        <line class="bar" id="b3" x1="700" x2="1220" y1="410" y2="410" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />
        <line class="bar" id="b4" x1="700" x2="1220" y1="448" y2="448" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />
        <line class="bar" id="b5" x1="700" x2="1220" y1="470" y2="470" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />
        <line class="bar" id="b6" x1="700" x2="1220" y1="512" y2="512" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />
        <line class="bar" id="b7" x1="700" x2="1220" y1="548" y2="548" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />
        <line class="bar" id="b8" x1="700" x2="1220" y1="590" y2="590" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />
        <line class="bar" id="b9" x1="700" x2="1220" y1="640" y2="640" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />
        <line class="bar" id="b10" x1="700" x2="1220" y1="700" y2="700" stroke="#F4F2EC" stroke-width="4" stroke-linecap="round" opacity="0" />

        <line id="avg" x1="680" x2="1240" y1="500" y2="500" stroke="#9a978f" stroke-width="3" stroke-dasharray="14 12" opacity="0" />
        <text id="avg-label" x="1256" y="508" font-size="24" fill="#9a978f" opacity="0">avg</text>

        <g id="nb-y" opacity="0">
          <line class="nb-line" x1="700" x2="1220" y1="0" y2="0" stroke="#F4F2EC" stroke-width="6" stroke-linecap="round" />
          <text class="nb-time" x="660" y="18" text-anchor="end" font-size="56" font-weight="800" fill="#F4F2EC" style="font-variant-numeric:tabular-nums">42.7</text>
        </g>
        <g id="nb-g" opacity="0">
          <line class="nb-line" x1="700" x2="1220" y1="0" y2="0" stroke="#F4F2EC" stroke-width="6" stroke-linecap="round" />
          <text class="nb-time" x="660" y="18" text-anchor="end" font-size="56" font-weight="800" fill="#F4F2EC" style="font-variant-numeric:tabular-nums">39.4</text>
        </g>
        <g id="nb-p" opacity="0">
          <line class="nb-line" x1="700" x2="1220" y1="0" y2="0" stroke="#F4F2EC" stroke-width="6" stroke-linecap="round" />
          <text class="nb-time" x="660" y="18" text-anchor="end" font-size="56" font-weight="800" fill="#F4F2EC" style="font-variant-numeric:tabular-nums">37.1</text>
        </g>
      </svg>
    </div>
  </div>

  <div id="cap2" class="clip full" data-start="0" data-duration="4" data-track-index="2">
    <div class="inner">
      <p class="caption">Your last ten rides through this sector.</p>
    </div>
  </div>

  <div id="cap3" class="clip full" data-start="4" data-duration="5" data-track-index="2">
    <div class="inner">
      <p class="caption tier" style="color:#F5C542;">Yellow.</p>
      <p class="caption second">Yellow is slower than your average.</p>
    </div>
  </div>

  <div id="cap4" class="clip full" data-start="9" data-duration="5" data-track-index="2">
    <div class="inner">
      <p class="caption tier" style="color:#3ED598;">Green.</p>
      <p class="caption second">Faster than your average.</p>
    </div>
  </div>

  <div id="cap5" class="clip full" data-start="14" data-duration="5" data-track-index="2">
    <div class="inner">
      <p class="caption tier" style="color:#A667F0;">Purple.</p>
      <p class="caption second">Faster than every one of your last ten.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    var tl = gsap.timeline({ paused: true });

    // ---------- Beat 1 (0-4): chart builds. Ten lines stack in bottom-up; the dashed avg appears WITH them. ----------
    var barOrder = ['#b10', '#b9', '#b8', '#b7', '#b6', '#b5', '#b4', '#b3', '#b2', '#b1'];
    barOrder.forEach(function (sel, i) {
      tl.fromTo(sel, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out' }, 0.3 + i * 0.12);
    });
    tl.fromTo(['#avg', '#avg-label'], { opacity: 0 }, { opacity: 1, duration: 1.2, ease: 'power1.inOut' }, 0.3);

    tl.set('#cap2 .inner', { opacity: 1 }, 0);
    tl.fromTo('#cap2 .caption', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.2);
    tl.to('#cap2 .inner', { opacity: 0, duration: 0.4 }, 3.6);
    tl.set('#cap2 .inner', { opacity: 0 }, 4.0);

    // One tier beat (5 s): the new ride's line enters from below and rises to its slot, turns its colour,
    // then the tier word (above) and the one-line explainer (below) fade in; captions out at t0+4.6..5.0.
    function tierBeat(t0, nb, yTo, colour, capSel, rise) {
      tl.set(nb, { y: 880, opacity: 1 }, t0);
      tl.to(nb, { y: yTo, duration: rise, ease: 'power2.out' }, t0);
      tl.to(nb + ' .nb-line', { stroke: colour, duration: 0.3 }, t0 + rise);
      tl.to(nb + ' .nb-time', { fill: colour, duration: 0.3 }, t0 + rise);
      tl.set(capSel + ' .inner', { opacity: 1 }, t0);
      tl.fromTo(capSel + ' .caption.tier',   { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, t0 + rise + 0.2);
      tl.fromTo(capSel + ' .caption.second', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, t0 + rise + 0.6);
      tl.to(capSel + ' .inner', { opacity: 0, duration: 0.4 }, t0 + 4.6);
      tl.set(capSel + ' .inner', { opacity: 0 }, t0 + 5.0);
    }

    // ---------- Beat 2 (4-9): yellow, slower than average. ----------
    tierBeat(4.0, '#nb-y', 620, '#F5C542', '#cap3', 0.7);
    tl.to('#nb-y', { opacity: 0, duration: 0.4 }, 8.6);
    tl.set('#nb-y', { opacity: 0 }, 9.0);

    // ---------- Beat 3 (9-14): green, faster than average (avg blinks as the line crosses it, as in v1). ----------
    tierBeat(9.0, '#nb-g', 440, '#3ED598', '#cap4', 0.7);
    tl.to('#avg', { opacity: 0.35, duration: 0.15, yoyo: true, repeat: 1 }, 9.7);
    tl.to('#nb-g', { opacity: 0, duration: 0.4 }, 13.6);
    tl.set('#nb-g', { opacity: 0 }, 14.0);

    // ---------- Beat 4 (14-19): purple, faster than all ten. Stays on the chart. ----------
    tierBeat(14.0, '#nb-p', 250, '#A667F0', '#cap5', 0.9);

    // ---------- End (18.6-19.0): fade to black. The rolling-window beat is a separate composition now. ----------
    tl.to('#chart .inner', { opacity: 0, duration: 0.4 }, 18.6);
    tl.set('#chart .inner', { opacity: 0 }, 19.0);

    window.__timelines = window.__timelines || {};
    window.__timelines.purple = tl;
  </script>

</div>

</body>
</html>
