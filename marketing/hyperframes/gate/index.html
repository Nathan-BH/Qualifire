<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Qualifire — The Gate (HyperFrames)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; }
  * { box-sizing: border-box; }

  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #0A0A0A;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #F4F2EC;
  }

  .clip { position: absolute; }
  .clip.full { top: 0; left: 0; width: 1920px; height: 1080px; }

  .mark-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 400px;
    height: 400px;
    margin: -200px 0 0 -200px;
  }
  .mark-wrap svg { width: 100%; height: 100%; display: block; }
  #slash { opacity: 0; }

  .endword {
    position: absolute;
    top: 660px;
    left: 0;
    width: 1920px;
    margin: 0;
    text-align: center;
    font-size: 84px;
    font-weight: 800;
    letter-spacing: 24px;
    color: #F5C542;
    opacity: 0;
  }

  #gate .inner { opacity: 1; }
</style>
</head>
<body>

<div id="stage" data-composition-id="gate" data-start="0" data-width="1920" data-height="1080">

  <!-- 5-second branded bumper: ring draws, slash lands, QUALIFIRE fades in, cuts to
       black. Geometry inlined from
       product/brand/logos/qualifire_logo_5_monogram_wordmark.svg (unscaled, 512x512
       viewBox) — same as the teaser's gate draw. -->
  <div id="gate" class="clip full" data-start="0" data-duration="5" data-track-index="0">
    <div class="inner">
      <div class="mark-wrap">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <circle id="ring" cx="256" cy="218" r="118" fill="none" stroke="#F4F2EC" stroke-width="30" stroke-linecap="round" transform="rotate(-90 256 218)" />
          <line id="slash" x1="291.355" y1="253.355" x2="387.5206" y2="349.5206" fill="none" stroke="#F5C542" stroke-width="30" stroke-linecap="round" />
        </svg>
      </div>
      <p class="endword">QUALIFIRE</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    var CIRC = 2 * Math.PI * 118;
    gsap.set('#ring', { strokeDasharray: CIRC });
    var tl = gsap.timeline({ paused: true });

    // draw at T0=0
    tl.fromTo('#ring', { strokeDashoffset: CIRC }, { strokeDashoffset: 0, duration: 1.3, ease: 'power2.inOut' }, 0);
    tl.fromTo('#slash', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power1.out' }, 1.3);

    // hold to 2.9
    tl.fromTo('.endword', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 2.9);

    // exit to black, ends exactly at clip end 5.0
    tl.to('#gate .inner', { opacity: 0, duration: 0.5, ease: 'power1.in' }, 4.5);
    tl.set('#gate .inner', { opacity: 0 }, 5.0);

    window.__timelines = window.__timelines || {};
    window.__timelines.gate = tl;
  </script>

</div>

</body>
</html>
