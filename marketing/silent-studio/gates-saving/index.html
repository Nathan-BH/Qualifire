<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<script src="theme.js"></script>
<meta charset="UTF-8">
<title>Qualifire — Gates & saving (HyperFrames)</title>
<style>
  /* ---- theme tokens: night = the app's native mood (default), day = the website's light theme.
          Selected by data-theme on <html>; render.ps1 -Theme day sets it via theme.js. ---- */
  :root {
    --bg: #0A0A0A; --bg-rgb: 10,10,10;
    --ink: #F4F2EC; --ink-dim: #9a978f;
    --card: #141414; --card-border: #232323;
    --route-casing: #14120C; --ring-fill: #14120C; --rider-stroke: #FFFFFF;
  }
  :root[data-theme="day"] {
    --bg: #FDFCF9; --bg-rgb: 253,252,249;
    --ink: #17171b; --ink-dim: #605e56;
    --card: #FFFFFF; --card-border: #E1DDD1;
    --route-casing: #14120C; --ring-fill: #FDFCF9; --rider-stroke: #17171b;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  * { box-sizing: border-box; }

  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }

  .clip { position: absolute; }
  .clip.full { top: 0; left: 0; width: 1920px; height: 1080px; }
  .clip .inner { opacity: 1; }

  /* ---- map layer: static basemap PNG (see ../_map/README.md) + SVG overlay in the app's casing+core style ---- */
  #basemap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  svg.full-svg { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; display: block; }
  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
  #scrim-bottom {
    position: absolute; left: 0; top: 780px; width: 1920px; height: 300px;
    background: linear-gradient(to bottom, rgba(var(--bg-rgb),0) 0%, rgba(var(--bg-rgb),0.92) 100%);
  }
  #attrib {
    position: absolute; right: 24px; bottom: 14px; margin: 0;
    font-size: 15px; letter-spacing: 0.3px; color: var(--ink-dim); opacity: 0.85;
  }
  #dim { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--bg); opacity: 0; }

  .caption {
    position: absolute; top: 990px; left: 0; width: 1920px; margin: 0; text-align: center;
    font-size: 44px; font-weight: 600; letter-spacing: 0.5px; color: var(--ink); opacity: 0; line-height: 1.3;
    text-shadow: 0 2px 12px rgba(var(--bg-rgb),0.6);
  }
  .caption .em-i { font-style: italic; font-weight: 600; }
  .caption .em-b { font-weight: 700; font-style: normal; }

  /* ---- START button: RecordScreen.tsx values at exactly 2x (150→300 tall, 40→80px label) ---- */
  #start-btn {
    position: absolute; left: 510px; top: 390px; width: 900px; height: 300px;
    border-radius: 48px; border: 4px solid #F5C542; background: #F5C542;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    opacity: 0;
  }
  #start-btn .label { margin: 0; font-size: 80px; font-weight: 800; letter-spacing: 10px; text-indent: 10px; line-height: 1; color: #17171b; }
  #start-btn .sub   { margin: 0; font-size: 24px; letter-spacing: 2px; text-indent: 2px; color: #17171b; opacity: 0.75; }

  /* ---- cards (ranking scene) ---- */
  .card {
    position: absolute; background: var(--card); border: 2px solid var(--card-border); border-radius: 24px; opacity: 0;
  }
  .card .hdr { position: absolute; left: 40px; right: 40px; top: 28px; display: flex; justify-content: space-between; align-items: baseline; }
  .card .lbl { font-size: 22px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-dim); }
  .num { font-variant-numeric: tabular-nums; }

  #rank-card { left: 560px; top: 300px; width: 800px; height: 330px; }
  #rank-pos { font-size: 40px; font-weight: 800; color: #9000C8; opacity: 0; }
  .rnum { position: absolute; left: 40px; width: 60px; font-size: 48px; font-weight: 800; color: var(--ink); line-height: 80px; }
  .rrow { position: absolute; left: 110px; right: 40px; height: 80px; display: flex; justify-content: space-between; align-items: center; opacity: 0; }
  .rrow .who  { font-size: 32px; font-weight: 600; color: var(--ink); }
  .rrow .time { font-size: 52px; font-weight: 800; color: var(--ink); }
  .rrow.today .who, .rrow.today .time { color: #9000C8; }

  #tower { left: 560px; top: 110px; width: 800px; height: 700px; }
  #tower .rows { position: absolute; left: 40px; right: 40px; top: 84px; }
  .trow { display: flex; align-items: center; height: 60px; opacity: 0; }
  .trow .rk   { width: 70px; font-size: 30px; font-weight: 800; color: var(--ink-dim); }
  .trow .who  { flex: 1; font-size: 26px; font-weight: 600; color: var(--ink); }
  .trow .time { font-size: 34px; font-weight: 800; color: var(--ink); }
  .trow.today .rk, .trow.today .who, .trow.today .time { color: #9000C8; }

  /* ---- SVG colour tokens (presentation attributes removed from the elements below) ---- */
  #route-casing { stroke: var(--route-casing); }
  .gate .gc { stroke: var(--route-casing); }
  #ring-start, #ring-end { fill: var(--ring-fill); stroke: var(--ink); }
  #rider { stroke: var(--rider-stroke); }
</style>
</head>
<body>

<div data-hf-id="hf-wi7b" id="stage" data-composition-id="gatessaving" data-start="0" data-width="1920" data-height="1080">

  <!-- Map layer: basemap PNG (captured once via ../_map/map-capture.html) + route/gates/rider as SVG.
       Casing+core convention and colours are the app's (see product code, RecordScreen / way map). -->
  <div data-hf-id="hf-5708" id="map" class="clip full" data-start="0" data-duration="12.4" data-track-index="0">
    <div data-hf-id="hf-lm34" class="inner">
      <div data-hf-id="hf-ftaq" id="cam">
        <img data-hf-id="hf-25zy" id="basemap" src="map.png" alt="" onerror="this.style.display='none'">
        <svg data-hf-id="hf-clm9" id="mapsvg" class="full-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <path data-hf-id="hf-8arj" id="route-casing" fill="none" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
          <path data-hf-id="hf-ze3x" id="route-core" fill="none" stroke="#F5C542" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
          <path data-hf-id="hf-l2w9" class="sector" id="sec1" fill="none" stroke="#00D000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0" />
          <path data-hf-id="hf-si8b" class="sector" id="sec2" fill="none" stroke="#F5C542" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0" />
          <path data-hf-id="hf-ofvj" class="sector" id="sec3" fill="none" stroke="#9000C8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0" />
          <path data-hf-id="hf-3itu" class="sector" id="sec4" fill="none" stroke="#00D000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0" />
          <g data-hf-id="hf-f0p9" class="gate" id="gate1" opacity="0"><line data-hf-id="hf-07c7" class="gc" stroke-width="8" stroke-linecap="round" /><line data-hf-id="hf-z04u" class="gk" style="stroke: var(--ink)" stroke-width="4" stroke-linecap="round" opacity="1" /></g>
          <g data-hf-id="hf-4pe2" class="gate" id="gate2" opacity="0"><line data-hf-id="hf-g1jb" class="gc" stroke-width="8" stroke-linecap="round" /><line data-hf-id="hf-26ia" class="gk" style="stroke: var(--ink)" stroke-width="4" stroke-linecap="round" opacity="1" /></g>
          <g data-hf-id="hf-eh3b" class="gate" id="gate3" opacity="0"><line data-hf-id="hf-fn8a" class="gc" stroke-width="8" stroke-linecap="round" /><line data-hf-id="hf-2ktb" class="gk" style="stroke: var(--ink)" stroke-width="4" stroke-linecap="round" opacity="1" /></g>
          <circle data-hf-id="hf-2ho0" id="ring-start" r="13" stroke-width="4" opacity="0" />
          <circle data-hf-id="hf-l2n3" id="ring-end" r="13" stroke-width="4" opacity="0" />
          <circle data-hf-id="hf-vjca" id="rider" r="11" fill="#2F7DE1" stroke-width="3" opacity="0" />
        </svg>
      </div>
      <div data-hf-id="hf-7iqb" id="scrim-bottom"></div>
      <div data-hf-id="hf-6pf9" id="dim"></div>
      <p data-hf-id="hf-fkgz" id="attrib">© OpenStreetMap contributors · OpenFreeMap</p>
    </div>
  </div>

  <div data-hf-id="hf-j1c9" id="ui" class="clip full" data-start="0" data-duration="12.4" data-track-index="1">
    <div data-hf-id="hf-bug8" class="inner">
      <p data-hf-id="hf-i78s" class="caption" id="capA">Save your route as reference.</p>
      <p data-hf-id="hf-t8wh" class="caption" id="capB">Next time. Start racing <span data-hf-id="hf-0b5e" class="em-i">your</span><span data-hf-id="hf-gwww" class="em-b">self</span>.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    // ---- shared constants (identical in ../_map/map-capture.html) ----
    // Route: qualifire-20260903-1828.gpx (pre-start + warm-up points dropped), projected to
    // 1920x1080 frame px at MAP_CENTER / MAP_ZOOM below (Web Mercator, 512-px tiles, bearing 180, no pitch).
    // Douglas-Peucker 0.7 px, 70 points, then reflected through the frame centre (x,y)->(1920-x,1080-y) to
    // match the capture page's bearing:180 (2026-09-10, per Nathan: ride should run bottom-left to top-right).
    // Do NOT edit by hand; regenerate from the GPX if the framing changes.
    var MAP_CENTER = [4.663233, 50.84662];   // [lon, lat]
    var MAP_ZOOM   = 13.4;
    var ROUTE = "577.0,948.7 578.3,946.1 587.4,940.8 590.9,942.8 591.0,947.5 594.6,952.3 600.9,957.1 612.0,951.2 628.8,946.5 640.6,940.1 647.0,934.5 650.7,933.1 680.0,906.9 682.9,905.7 684.4,908.7 687.0,909.9 718.3,885.5 755.1,859.2 784.7,851.6 830.7,830.3 836.7,833.6 848.2,835.8 854.2,835.6 858.6,833.9 935.4,752.8 975.7,720.7 988.2,706.0 988.5,693.2 984.8,688.8 977.8,684.5 958.3,677.3 954.2,679.7 949.1,679.2 915.3,666.6 914.4,663.0 916.5,658.5 922.5,650.9 924.4,645.7 922.9,642.6 923.9,641.4 926.1,640.4 929.9,641.0 936.2,645.0 949.8,650.0 954.6,652.8 977.5,661.0 986.2,656.2 1046.2,607.4 1063.2,592.6 1088.3,539.3 1099.0,520.7 1109.9,505.7 1124.1,488.9 1129.9,478.9 1149.6,455.4 1161.0,436.3 1163.0,435.0 1192.4,430.8 1220.7,402.9 1243.8,377.3 1248.4,368.1 1250.7,359.8 1272.0,333.6 1273.6,319.2 1279.4,318.7 1313.6,288.5 1319.5,286.8 1324.1,282.9 1342.8,293.3 1345.0,293.1";
    var GATES = [0.24, 0.63, 0.84];                                  // fractions of route length (clear of the 0.40-0.57 self-loop)
    var SECTOR_COLORS = ['#00D000', '#F5C542', '#9000C8', '#00D000'];  // sector k ends at gate k; sector 4 ends at the finish
    // -------------------------------------------------------------------

    // Day theme uses the positron basemap captured by ../_map/map-capture.html?theme=day (see _map/README.md).
    if (document.documentElement.getAttribute('data-theme') === 'day') {
      document.getElementById('basemap').src = 'map-day.png';
    }

    // Build the overlay geometry from ROUTE (runs once, before the timeline).
    var pts = ROUTE.split(' ').map(function (s) { var a = s.split(','); return [parseFloat(a[0]), parseFloat(a[1])]; });
    var dAttr = 'M' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' L');
    ['route-casing', 'route-core', 'sec1', 'sec2', 'sec3', 'sec4'].forEach(function (id) { document.getElementById(id).setAttribute('d', dAttr); });
    var core = document.getElementById('route-core');
    var L = core.getTotalLength();
    function at(len) { return core.getPointAtLength(Math.max(0, Math.min(L, len))); }
    var P0 = at(0), P1 = at(L);

    // Scored-sector overlays: one dash window per sector on a copy of the route path.
    var bounds = [0].concat(GATES).concat([1]);
    for (var s = 0; s < 4; s++) {
      var a = bounds[s] * L, b = bounds[s + 1] * L, el = document.getElementById('sec' + (s + 1));
      el.setAttribute('stroke-dasharray', (b - a) + ' ' + L);
      el.setAttribute('stroke-dashoffset', -a);
    }

    // Gates: 44-px tick perpendicular to the local heading, centred exactly on the route point.
    var GATE_PT = [];
    GATES.forEach(function (f, i) {
      var p = at(f * L), q1 = at(f * L - 8), q2 = at(f * L + 8);
      var ang = Math.atan2(q2.y - q1.y, q2.x - q1.x) + Math.PI / 2;
      var dx = Math.cos(ang) * 22, dy = Math.sin(ang) * 22;
      var g = document.getElementById('gate' + (i + 1));
      Array.prototype.forEach.call(g.querySelectorAll('line'), function (ln) {
        ln.setAttribute('x1', p.x - dx); ln.setAttribute('y1', p.y - dy);
        ln.setAttribute('x2', p.x + dx); ln.setAttribute('y2', p.y + dy);
      });
      GATE_PT.push(p);
    });
    // Each tick is exactly 44 px long (±22 px about the route point, see dx/dy above). Seed the
    // same stroke-dash reveal the brand mark's ring uses: dasharray = length, offset = length = hidden.
    var GATE_LEN = 44;
    gsap.set('.gate line', { strokeDasharray: GATE_LEN, strokeDashoffset: GATE_LEN });

    gsap.set('#ring-start', { attr: { cx: P0.x, cy: P0.y } });
    gsap.set('#ring-end',   { attr: { cx: P1.x, cy: P1.y } });
    // Rider carries over from start-ride's finishing frame: starts at the route's finish point, full opacity,
    // then fades out over the zoom-out lead-in before fading back in for this scene's own ride (see below).
    gsap.set('#rider',      { attr: { cx: P1.x, cy: P1.y, r: 7, 'stroke-width': 2 }, opacity: 1 });

    // ---- camera (ported verbatim from start-ride, for the zoom-out lead-in match-cut) ----
    var CAM_S = 2.0;
    var CAM_MIN_X = 960 / CAM_S, CAM_MAX_X = 1920 - 960 / CAM_S;   // 480..1440
    var CAM_MIN_Y = 540 / CAM_S, CAM_MAX_Y = 1080 - 540 / CAM_S;   // 270..810
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function camAt(len) {   // mean of the route over +/-5% of L around len, clamped to the basemap
      var W = 0.05 * L, sx = 0, sy = 0, n = 0;
      for (var k = -10; k <= 10; k++) { var q = at(len + k / 10 * W); sx += q.x; sy += q.y; n++; }
      return { x: clamp(sx / n, CAM_MIN_X, CAM_MAX_X), y: clamp(sy / n, CAM_MIN_Y, CAM_MAX_Y) };
    }
    function camXY(c, s) { return { x: s * (960 - c.x), y: s * (540 - c.y) }; }   // for transform-origin 50% 50%

    // camStart = camera centred on the route's finish (camAt(L)) at 2x -- reproduces start-ride's own
    // final camera position almost exactly, so the lead-in continues that frame instead of cutting to it.
    var camStart = camXY(camAt(L), CAM_S);
    gsap.set('#cam', { x: 0, y: 0, scale: 1, transformOrigin: '50% 50%' });
    gsap.set('#cam', { x: camStart.x, y: camStart.y, scale: CAM_S });

    // Melody-aligned pacing (2026-09-20, Nathan's idea): the old build synthesized an E5
    // chime whenever the (constant-speed) rider crossed a gate. Nathan: audio should be
    // the real reference, no extra sound for the gate crossing -- instead adapt the RIDE
    // so the gates land on beats that are already in the real melody. GATES (route
    // fractions) stay fixed -- they're real gate geography -- but the rider's speed along
    // the route now varies so gate1/2/3 land exactly on three of the Interstellar
    // soundtrack's own E5 pulses instead of being evenly spaced in time. See
    // audio-studio/piano/projects/interstellar/NOTES.md and
    // audio-studio/gates-saving/soundv8/FEEDBACK.md for where these numbers come from and
    // the audio side of this change (no separate gate-chime layer any more).
    //
    // RIDE_WARP: [routeFraction, rideRelativeSeconds] anchors, piecewise-linear between
    // them -- speed is constant within a leg, and changes (not smoothly) at each anchor.
    // The first leg is the fast one: about 3x the old constant speed, to reach the
    // melody's first beat only 0.52s after the ride starts. Flagged in soundv8's
    // FEEDBACK.md as the thing most likely to need a second look.
    var RIDE_WARP = [
      [0, 0],
      [0.24, 0.52],   // gate1 -> melody E5 at content t=0.92s (bass_only/voice_a/melody share this clock)
      [0.63, 2.38],   // gate2 -> melody E5 at content t=2.78s
      [0.84, 4.25],   // gate3 -> melody E5 at content t=4.65s
      [1, 6.9],        // ride end, unchanged (== RIDE_DUR)
    ];
    function warpTime(f) {
      for (var i = 1; i < RIDE_WARP.length; i++) {
        var a = RIDE_WARP[i - 1], b = RIDE_WARP[i];
        if (f <= b[0]) { var t = (f - a[0]) / (b[0] - a[0]); return a[1] + t * (b[1] - a[1]); }
      }
      return RIDE_WARP[RIDE_WARP.length - 1][1];
    }

    // Rider along the route, paced by RIDE_WARP instead of constant speed: still 240 short
    // linear tweens (no callbacks, no plugins, so a frame-seeking renderer always lands on
    // the right point) -- each step's position comes from arc length as before, but its
    // duration now comes from the warp curve instead of being evenly spaced.
    function ride(tl, start, dur) {
      var N = 240, prev = at(0), prevT = 0;
      for (var i = 1; i <= N; i++) {
        var f = i / N, p = at(f * L), t = warpTime(f);
        var stepDur = Math.max(0.0001, t - prevT);
        tl.fromTo('#rider', { attr: { cx: prev.x, cy: prev.y } },
          { attr: { cx: p.x, cy: p.y }, duration: stepDur, ease: 'none', immediateRender: false, lazy: false },
          start + prevT);
        prev = p; prevT = t;
      }
    }

    var tl = gsap.timeline({ paused: true });

    // Frame 0: continuing from start-ride's finishing 2x frame -- zoomed in on the route's finish,
    // rider still there (fades out over the lead-in below); route already fully drawn, nothing saved yet.

    // Beat 0 (0-1.0): zoom-out lead-in, continuing the camera from start-ride's end frame down to this
    // scene's normal framing. Stroke widths crossfade from start-ride's 2x-reduced values (7/4) to
    // gates-saving's normal values (10/6) over the same 1.0s. Rider (left over from start-ride) fades out.
    tl.fromTo('#cam', { x: camStart.x, y: camStart.y, scale: CAM_S }, { x: 0, y: 0, scale: 1, duration: 1.0, ease: 'power2.inOut' }, 0);
    tl.fromTo('#route-casing', { attr: { 'stroke-width': 7 } }, { attr: { 'stroke-width': 10 }, duration: 1.0, ease: 'power2.inOut' }, 0);
    tl.fromTo('#route-core', { attr: { 'stroke-width': 4 } }, { attr: { 'stroke-width': 6 }, duration: 1.0, ease: 'power2.inOut' }, 0);
    tl.to('#rider', { opacity: 0, duration: 0.5, ease: 'power1.in' }, 0);
    // Snap the (now-invisible) rider back to the route's start point, so its 4.4s fade-in for the
    // second ride reappears at the start line rather than jumping there from the finish at 4.8s.
    tl.set('#rider', { attr: { cx: P0.x, cy: P0.y, r: 11, 'stroke-width': 3 } }, 0.5);

    // Beat 1 (1.05-1.55): start/end landmark rings pop in.
    tl.fromTo('#ring-start', { opacity: 0, scale: 0, svgOrigin: P0.x + ' ' + P0.y }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 1.05);
    tl.fromTo('#ring-end',   { opacity: 0, scale: 0, svgOrigin: P1.x + ' ' + P1.y }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 1.15);

    // Beat 2 (1.6-4.9): caption + three gate ticks pop in, centred on the route.
    tl.fromTo('#capA', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.6);
    // Gates draw across the route the way the brand mark's ring draws on (stroke-dash reveal),
    // casing and tick together as one stroke. Same stagger points as before (1.9 / 2.2 / 2.5).
    GATE_PT.forEach(function (p, i) {
      var t0 = 1.9 + i * 0.3;
      tl.set('#gate' + (i + 1), { opacity: 1 }, t0);
      tl.fromTo('#gate' + (i + 1) + ' line', { strokeDashoffset: GATE_LEN },
        { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' }, t0);
    });
    tl.to('#capA', { opacity: 0, duration: 0.4 }, 4.5);
    tl.set('#capA', { opacity: 0 }, 4.9);

    // Beat 3 (5.2-12.3): caption B -- fades in while the second ride (started 4.8) is already running.
    tl.fromTo('#capB', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 5.2);
    tl.to('#capB', { opacity: 0, duration: 0.4 }, 11.9);
    tl.set('#capB', { opacity: 0 }, 12.3);

    // Beat 4 (4.8-11.7): second ride. Crossing a gate = that sector paints its tier colour (cycle 9: the overlay
    // is now the core's own 6px, so the line changes colour but never width; the gate ticks stay white -- the
    // old recolour-on-cross was never a wanted feature, per Nathan).
    var RIDE_T0 = 4.8, RIDE_DUR = 6.9;
    tl.fromTo('#rider', { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 4.4);
    ride(tl, RIDE_T0, RIDE_DUR);
    // Sector recolouring must fire when the WARPED rider actually reaches each gate, not
    // at the old uniform-speed time -- otherwise a sector repaints before/after the dot
    // visually gets there. warpTime(f) is the same curve ride() uses to place the rider.
    GATES.forEach(function (f, i) {
      var t = RIDE_T0 + warpTime(f);
      tl.to('#sec' + (i + 1), { opacity: 1, duration: 0.25 }, t);
    });
    tl.to('#sec4', { opacity: 1, duration: 0.25 }, RIDE_T0 + RIDE_DUR);
    // hold to 12.4
    tl.set('#rider', { opacity: 1 }, 11.70);

    window.__timelines = window.__timelines || {};
