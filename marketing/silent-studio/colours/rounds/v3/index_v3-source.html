<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<script src="theme.js"></script>
<meta charset="UTF-8">
<title>Qualifire — Why purple is rare (HyperFrames)</title>
<style>
  /* ---- theme tokens: night = the app's native mood (default), day = the website's light theme.
          Selected by data-theme on <html>; render.ps1 -Theme day sets it via theme.js. ---- */
  :root {
    --bg: #0A0A0A; --bg-rgb: 10,10,10;
    --ink: #F4F2EC; --ink-dim: #9a978f;
    --card: #141414; --card-border: #232323;
    --route-casing: #14120C; --ring-fill: #14120C; --rider-stroke: #FFFFFF;
  }
  :root[data-theme="day"] {
    --bg: #FDFCF9; --bg-rgb: 253,252,249;
    --ink: #17171b; --ink-dim: #605e56;
    --card: #FFFFFF; --card-border: #E1DDD1;
    --route-casing: #14120C; --ring-fill: #FDFCF9; --rider-stroke: #17171b;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  * { box-sizing: border-box; }

  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }

  .clip { position: absolute; }
  .clip.full { top: 0; left: 0; width: 1920px; height: 1080px; }
  .clip .inner { opacity: 0; }

  /* first beat starts drawing immediately, so it starts visible */
  #chart .inner { opacity: 1; }

  .caption {
    position: absolute; top: 920px; left: 0; width: 1920px; margin: 0; text-align: center;
    font-size: 44px; font-weight: 600; letter-spacing: 0.5px; color: var(--ink); opacity: 0; line-height: 1.3;
  }
  .caption.second { top: 985px; }
  .caption.tier { top: 900px; font-size: 56px; }

  #tower { position: absolute; left: 560px; top: 170px; width: 800px; height: 660px; }
  .tnum { position: absolute; left: 0; width: 80px; height: 60px; margin: 0; line-height: 60px; text-align: right;
          font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-dim); opacity: 0; }
  .trow { position: absolute; left: 120px; width: 500px; height: 60px; opacity: 0; }
  .trow .rule { position: absolute; left: 0; top: 28px; width: 500px; height: 4px; border-radius: 2px; background: var(--ink); }
  #avg { position: absolute; left: 100px; top: 299px; width: 540px; height: 0; border-top: 3px dashed var(--ink-dim); opacity: 0; }
  #avg-label { position: absolute; left: 656px; top: 285px; margin: 0; font-size: 24px; line-height: 30px; color: var(--ink-dim); opacity: 0; }
  #ride { position: absolute; left: 120px; top: 600px; width: 680px; height: 60px; opacity: 0; }
  #ride .rule { position: absolute; left: 0; top: 27px; width: 500px; height: 6px; border-radius: 3px; background: var(--ink); }
  #ride .time { position: absolute; left: 536px; top: 0; margin: 0; height: 60px; line-height: 60px; font-size: 44px; font-weight: 800;
                font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  #ride .time.t2, #ride .time.t3 { opacity: 0; }
</style>
</head>
<body>

<div id="stage" data-composition-id="purple" data-start="0" data-width="1920" data-height="1080">

  <!-- Beats 1-4 (0-19s): the chart. Vertical position = speed, higher = faster. -->
  <div id="chart" class="clip full" data-start="0" data-duration="19" data-track-index="1">
    <div class="inner">
      <div id="tower">
        <p class="tnum" id="tn-1"  style="top:0px">1</p>
        <p class="tnum" id="tn-2"  style="top:60px">2</p>
        <p class="tnum" id="tn-3"  style="top:120px">3</p>
        <p class="tnum" id="tn-4"  style="top:180px">4</p>
        <p class="tnum" id="tn-5"  style="top:240px">5</p>
        <p class="tnum" id="tn-6"  style="top:300px">6</p>
        <p class="tnum" id="tn-7"  style="top:360px">7</p>
        <p class="tnum" id="tn-8"  style="top:420px">8</p>
        <p class="tnum" id="tn-9"  style="top:480px">9</p>
        <p class="tnum" id="tn-10" style="top:540px">10</p>

        <div class="trow" id="trow-1"  style="top:0px"><div class="rule"></div></div>
        <div class="trow" id="trow-2"  style="top:60px"><div class="rule"></div></div>
        <div class="trow" id="trow-3"  style="top:120px"><div class="rule"></div></div>
        <div class="trow" id="trow-4"  style="top:180px"><div class="rule"></div></div>
        <div class="trow" id="trow-5"  style="top:240px"><div class="rule"></div></div>
        <div class="trow" id="trow-6"  style="top:300px"><div class="rule"></div></div>
        <div class="trow" id="trow-7"  style="top:360px"><div class="rule"></div></div>
        <div class="trow" id="trow-8"  style="top:420px"><div class="rule"></div></div>
        <div class="trow" id="trow-9"  style="top:480px"><div class="rule"></div></div>
        <div class="trow" id="trow-10" style="top:540px"><div class="rule"></div></div>

        <div id="avg"></div>
        <p id="avg-label">avg</p>

        <div id="ride">
          <div class="rule"></div>
          <p class="time t1">42.7</p>
          <p class="time t2">39.4</p>
          <p class="time t3">37.1</p>
        </div>
      </div>
    </div>
  </div>

  <div id="cap2" class="clip full" data-start="0" data-duration="4" data-track-index="2">
    <div class="inner">
      <p class="caption">Your last ten rides through this sector.</p>
    </div>
  </div>

  <div id="cap3" class="clip full" data-start="4" data-duration="5" data-track-index="2">
    <div class="inner">
      <p class="caption tier" style="color:#F5C542;">Yellow.</p>
      <p class="caption second">Yellow is slower than your average.</p>
    </div>
  </div>

  <div id="cap4" class="clip full" data-start="9" data-duration="5" data-track-index="2">
    <div class="inner">
      <p class="caption tier" style="color:#00D000;">Green.</p>
      <p class="caption second">Faster than your average.</p>
    </div>
  </div>

  <div id="cap5" class="clip full" data-start="14" data-duration="5" data-track-index="2">
    <div class="inner">
      <p class="caption tier" style="color:#9000C8;">Purple.</p>
      <p class="caption second">Faster than every one of your last ten.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    var tl = gsap.timeline({ paused: true });

    // ---------- Beat 1 (0-4): the tower builds top-down (rank 1 first); the dashed avg appears WITH it. ----------
    for (var i = 1; i <= 10; i++) {
      tl.fromTo(['#tn-' + i, '#trow-' + i], { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out' }, 0.3 + (i - 1) * 0.12);
    }
    tl.fromTo(['#avg', '#avg-label'], { opacity: 0 }, { opacity: 1, duration: 1.2, ease: 'power1.inOut' }, 0.3);

    tl.set('#cap2 .inner', { opacity: 1 }, 0);
    tl.fromTo('#cap2 .caption', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 1.2);
    tl.to('#cap2 .inner', { opacity: 0, duration: 0.4 }, 3.6);
    tl.set('#cap2 .inner', { opacity: 0 }, 4.0);

    // One tier beat (5s): the ride climbs from wherever it is to topTo (px inside #tower; slot n sits at (n-1)*60),
    // keeps its previous colour while climbing and flips to the new colour ON landing (t0+rise), as ranking/ does.
    // Then the tier word and the one-line explainer fade in; captions out at t0+4.6..5.0. Caption timing == v2.
    function tierBeat(t0, topTo, colour, capSel, rise) {
      tl.to('#ride', { top: topTo, duration: rise, ease: 'power2.out' }, t0);
      tl.set('#ride .rule', { backgroundColor: colour }, t0 + rise);
      tl.set('#ride .time', { color: colour }, t0 + rise);
      tl.set(capSel + ' .inner', { opacity: 1 }, t0);
      tl.fromTo(capSel + ' .caption.tier',   { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, t0 + rise + 0.2);
      tl.fromTo(capSel + ' .caption.second', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, t0 + rise + 0.6);
      tl.to(capSel + ' .inner', { opacity: 0, duration: 0.4 }, t0 + 4.6);
      tl.set(capSel + ' .inner', { opacity: 0 }, t0 + 5.0);
    }

    // A row the ride overtakes steps down one slot (60px) as the ride passes it.
    function stepDown(sel, topTo, at) {
      tl.to(sel, { top: topTo, duration: 0.3, ease: 'power2.inOut' }, at);
    }

    // Show time label n (1..3) and hide the others, at the moment the ride departs.
    function showTime(n, at) {
      tl.set('#ride .time.t1', { opacity: n === 1 ? 1 : 0 }, at);
      tl.set('#ride .time.t2', { opacity: n === 2 ? 1 : 0 }, at);
      tl.set('#ride .time.t3', { opacity: n === 3 ? 1 : 0 }, at);
    }

    // ---------- Beat 2 (4-9): yellow, slower than average. Ride fades in below row 10 and climbs to P7; rows 7-10 step down, row 10 drops off. ----------
    tl.fromTo('#ride', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.out' }, 4.0);
    tierBeat(4.0, 360, '#F5C542', '#cap3', 0.7);
    stepDown('#trow-10', 600, 4.05);
    tl.to('#trow-10', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 4.05);
    stepDown('#trow-9', 540, 4.15);
    stepDown('#trow-8', 480, 4.27);
    stepDown('#trow-7', 420, 4.45);

    // ---------- Beat 3 (9-14): green, faster than average. New time at departure; climbs P7 -> P3; rows 3-6 step down; avg blinks as the ride crosses it. ----------
    showTime(2, 9.0);
    tierBeat(9.0, 120, '#00D000', '#cap4', 0.7);
    stepDown('#trow-6', 360, 9.05);
    stepDown('#trow-5', 300, 9.15);
    tl.to('#avg', { opacity: 0.35, duration: 0.15, yoyo: true, repeat: 1 }, 9.15);
    stepDown('#trow-4', 240, 9.27);
    stepDown('#trow-3', 180, 9.45);

    // ---------- Beat 4 (14-19): purple, faster than all ten. New time at departure; climbs P3 -> P1 and stays; rows 1-2 step down. ----------
    showTime(3, 14.0);
    tierBeat(14.0, 0, '#9000C8', '#cap5', 0.9);
    stepDown('#trow-2', 120, 14.12);
    stepDown('#trow-1', 60, 14.45);

    // ---------- End (18.6-19.0): fade to black. ----------
    tl.to('#chart .inner', { opacity: 0, duration: 0.4 }, 18.6);
    tl.set('#chart .inner', { opacity: 0 }, 19.0);

    window.__timelines = window.__timelines || {};
    window.__timelines.purple = tl;
  </script>

</div>

</body>
</html>
