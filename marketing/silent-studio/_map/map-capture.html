<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Qualifire — map capture (run once in Chrome, saves map.png)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
<style>
  body { margin: 0; background: #0A0A0A; color: #F4F2EC; font-family: "Segoe UI", Arial, sans-serif; }
  #bar { padding: 12px 16px; font-size: 15px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  #dl { font-size: 16px; padding: 8px 18px; background: #F5C542; color: #17171b; border: 0; border-radius: 8px; font-weight: 800; letter-spacing: 1px; cursor: pointer; }
  #dl:disabled { opacity: .4; cursor: default; }
  #status { color: #9a978f; }
  #wrap { position: relative; width: 1920px; height: 1080px; }
  #map { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #overlay { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
</style>
</head>
<body>
<div id="bar">
  <b>Qualifire map capture</b>
  <span id="status">Loading tiles…</span>
  <button id="dl" disabled>Download map.png</button>
  <span>Check that the yellow route sits on the roads (scroll to see the whole 1920×1080 frame), then download.</span>
</div>
<div id="wrap">
  <div id="map"></div>
  <!-- Alignment check only — NOT part of the saved PNG. Same polyline as the three compositions. -->
  <svg id="overlay" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <polyline id="chk-casing" fill="none" stroke="#14120C" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
    <polyline id="chk-core"   fill="none" stroke="#F5C542" stroke-width="6"  stroke-linejoin="round" stroke-linecap="round" />
  </svg>
</div>
<script>
  // ---- shared constants (identical in start-ride / gates-saving / ranking index.html) ----
  // Route: qualifire-20260903-1828.gpx (pre-start + warm-up points dropped), projected to
  // 1920x1080 frame px at MAP_CENTER / MAP_ZOOM below (Web Mercator, 512-px tiles, bearing 180, no pitch).
  // Douglas-Peucker 0.7 px, 70 points, then reflected through the frame centre (x,y)->(1920-x,1080-y) to
  // match this page's bearing:180 (2026-09-10, per Nathan: ride should run bottom-left to top-right).
  // Do NOT edit by hand; regenerate from the GPX if the framing changes.
  var MAP_CENTER = [4.663233, 50.84662];   // [lon, lat]
  var MAP_ZOOM   = 13.4;
  var ROUTE = "577.0,948.7 578.3,946.1 587.4,940.8 590.9,942.8 591.0,947.5 594.6,952.3 600.9,957.1 612.0,951.2 628.8,946.5 640.6,940.1 647.0,934.5 650.7,933.1 680.0,906.9 682.9,905.7 684.4,908.7 687.0,909.9 718.3,885.5 755.1,859.2 784.7,851.6 830.7,830.3 836.7,833.6 848.2,835.8 854.2,835.6 858.6,833.9 935.4,752.8 975.7,720.7 988.2,706.0 988.5,693.2 984.8,688.8 977.8,684.5 958.3,677.3 954.2,679.7 949.1,679.2 915.3,666.6 914.4,663.0 916.5,658.5 922.5,650.9 924.4,645.7 922.9,642.6 923.9,641.4 926.1,640.4 929.9,641.0 936.2,645.0 949.8,650.0 954.6,652.8 977.5,661.0 986.2,656.2 1046.2,607.4 1063.2,592.6 1088.3,539.3 1099.0,520.7 1109.9,505.7 1124.1,488.9 1129.9,478.9 1149.6,455.4 1161.0,436.3 1163.0,435.0 1192.4,430.8 1220.7,402.9 1243.8,377.3 1248.4,368.1 1250.7,359.8 1272.0,333.6 1273.6,319.2 1279.4,318.7 1313.6,288.5 1319.5,286.8 1324.1,282.9 1342.8,293.3 1345.0,293.1";
  var GATES = [0.24, 0.63, 0.84];                                  // fractions of route length (clear of the 0.40-0.57 self-loop)
  var SECTOR_COLORS = ['#A667F0', '#F5C542', '#A667F0', '#A667F0'];  // sector k ends at gate k; sector 4 ends at the finish
  // ---------------------------------------------------------------------------------------
  var STYLE = 'https://tiles.openfreemap.org/styles/dark';      // the app's night style; day = https://tiles.openfreemap.org/styles/positron
  var PIXEL_RATIO = 2;                                           // PNG comes out 3840x2160 for a 1920x1080 frame

  document.getElementById('chk-casing').setAttribute('points', ROUTE);
  document.getElementById('chk-core').setAttribute('points', ROUTE);

  var status = document.getElementById('status'), btn = document.getElementById('dl');
  var map = new maplibregl.Map({
    container: 'map', style: STYLE, center: MAP_CENTER, zoom: MAP_ZOOM, bearing: 180, pitch: 0,
    interactive: false, attributionControl: false, fadeDuration: 0,
    preserveDrawingBuffer: true, pixelRatio: PIXEL_RATIO
  });
  map.on('error', function (e) { status.textContent = 'ERROR: ' + ((e && e.error && e.error.message) || e); });
  map.once('idle', function () {
    setTimeout(function () {
      var c = map.getCanvas();
      status.textContent = 'READY — tiles loaded, canvas ' + c.width + 'x' + c.height;
      btn.disabled = false;
    }, 1500);
  });
  btn.onclick = function () {
    map.getCanvas().toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'map.png';
      document.body.appendChild(a); a.click(); a.remove();
      status.textContent = 'Saved map.png to your Downloads folder.';
    }, 'image/png');
  };
</script>
</body>
</html>
