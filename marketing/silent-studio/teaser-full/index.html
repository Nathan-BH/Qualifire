<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<script src="theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Qualifire — Teaser, full (HyperFrames)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>
  /* ---- theme tokens: night = the app's native mood (default), day = the website's light theme.
          Selected by data-theme on <html>; render.ps1 -Theme day sets it via theme.js.
          This is the ONLY declaration of these tokens in teaser-full: the five sub-compositions
          in compositions/ are mounted into this document and inherit them from <html>. ---- */
  :root {
    --bg: #0A0A0A; --bg-rgb: 10,10,10;
    --ink: #F4F2EC; --ink-dim: #9a978f;
    --card: #141414; --card-border: #232323;
    --route-casing: #14120C; --ring-fill: #14120C; --rider-stroke: #FFFFFF;
  }
  :root[data-theme="day"] {
    --bg: #FDFCF9; --bg-rgb: 253,252,249;
    --ink: #17171b; --ink-dim: #605e56;
    --card: #FFFFFF; --card-border: #E1DDD1;
    --route-casing: #14120C; --ring-fill: #FDFCF9; --rider-stroke: #17171b;
  }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  * { box-sizing: border-box; }

  #stage { position: relative; width: 1920px; height: 1080px; background: var(--bg); overflow: hidden; }
  /* the five scene slots stack on the same 1920x1080 canvas; the HyperFrames runtime shows
     each one only inside its own data-start/data-duration window */
  #stage > .clip { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>

<!-- teaser-full v2 (2026-09-26): one real HyperFrames render of the whole teaser. Each scene is a
     sub-composition in compositions/ mounted here via data-composition-src; data-start is root-absolute.
     Scene lengths: opening 6.2, start-ride 13.2, gates-saving 12.3, ranking 10.8, closing 4.0 = 46.5 s.
     The root registers ONLY an empty paused timeline — HyperFrames seeks each child timeline itself.
     v1 (manual master.add() merge, lint-rejected) is archived in
     ../../cycles/21_teaser-single-render-unification/v1-merged-timelines/.
     Piano-note sync fix (2026-09-26): start-ride's blank lead-in cut 1.0s->0.2s (cycle 20
     OPEN-ITEMS.md #2 / cycle 21's "open decision (a)", Nathan's call) shrinks start-ride 14.0->13.2,
     cascading -0.8s into every later scene's start below and the total duration (47.3->46.5). Needs
     re-render + kitv3 rebuild before this is real in the tool -- see teaser-lanes/README.md. -->
<div data-hf-id="hf-v7l9" id="stage" data-composition-id="teaser" data-start="0" data-duration="46.5" data-width="1920" data-height="1080">
  <div data-hf-id="hf-z1m1" id="opening-slot" class="clip" data-composition-id="opening" data-composition-src="compositions/opening.html" data-start="0" data-duration="6.2" data-track-index="0"></div>
  <div data-hf-id="hf-7prv" id="startride-slot" class="clip" data-composition-id="startride" data-composition-src="compositions/startride.html" data-start="6.2" data-duration="13.2" data-track-index="1"></div>
  <div data-hf-id="hf-gkth" id="gatessaving-slot" class="clip" data-composition-id="gatessaving" data-composition-src="compositions/gatessaving.html" data-start="19.4" data-duration="12.3" data-track-index="2"></div>
  <div data-hf-id="hf-vrnl" id="ranking-slot" class="clip" data-composition-id="ranking" data-composition-src="compositions/ranking.html" data-start="31.7" data-duration="10.8" data-track-index="3"></div>
  <div data-hf-id="hf-mitg" id="closing-slot" class="clip" data-composition-id="closing" data-composition-src="compositions/closing.html" data-start="42.5" data-duration="4.0" data-track-index="4"></div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  window.__timelines.teaser = gsap.timeline({ paused: true });
</script>

</body>
</html>
