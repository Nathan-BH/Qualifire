    <script>
(function () {
  var R = (document.currentScript && document.currentScript.closest('#ranking-scene')) || document.querySelector('#ranking-scene');

  gsap.context(function () {
    // ---- shared constants (identical in ../_map/map-capture.html) ----
    // Route: qualifire-20260903-1828.gpx (pre-start + warm-up points dropped), projected to
    // 1920x1080 frame px at MAP_CENTER / MAP_ZOOM below (Web Mercator, 512-px tiles, bearing 180, no pitch).
    // Douglas-Peucker 0.7 px, 70 points, then reflected through the frame centre (x,y)->(1920-x,1080-y) to
    // match the capture page's bearing:180 (2026-09-10, per Nathan: ride should run bottom-left to top-right).
    // Do NOT edit by hand; regenerate from the GPX if the framing changes.
    var MAP_CENTER = [4.663233, 50.84662];   // [lon, lat]
    var MAP_ZOOM   = 13.4;
    var ROUTE = "577.0,948.7 578.3,946.1 587.4,940.8 590.9,942.8 591.0,947.5 594.6,952.3 600.9,957.1 612.0,951.2 628.8,946.5 640.6,940.1 647.0,934.5 650.7,933.1 680.0,906.9 682.9,905.7 684.4,908.7 687.0,909.9 718.3,885.5 755.1,859.2 784.7,851.6 830.7,830.3 836.7,833.6 848.2,835.8 854.2,835.6 858.6,833.9 935.4,752.8 975.7,720.7 988.2,706.0 988.5,693.2 984.8,688.8 977.8,684.5 958.3,677.3 954.2,679.7 949.1,679.2 915.3,666.6 914.4,663.0 916.5,658.5 922.5,650.9 924.4,645.7 922.9,642.6 923.9,641.4 926.1,640.4 929.9,641.0 936.2,645.0 949.8,650.0 954.6,652.8 977.5,661.0 986.2,656.2 1046.2,607.4 1063.2,592.6 1088.3,539.3 1099.0,520.7 1109.9,505.7 1124.1,488.9 1129.9,478.9 1149.6,455.4 1161.0,436.3 1163.0,435.0 1192.4,430.8 1220.7,402.9 1243.8,377.3 1248.4,368.1 1250.7,359.8 1272.0,333.6 1273.6,319.2 1279.4,318.7 1313.6,288.5 1319.5,286.8 1324.1,282.9 1342.8,293.3 1345.0,293.1";
    var GATES = [0.24, 0.63, 0.84];                                  // fractions of route length (clear of the 0.40-0.57 self-loop)
    var SECTOR_COLORS = ['#00D000', '#F5C542', '#9000C8', '#00D000'];  // sector k ends at gate k; sector 4 ends at the finish
    // -------------------------------------------------------------------

    // Day theme uses the positron basemap captured by ../_map/map-capture.html?theme=day (see _map/README.md).
    if (document.documentElement.getAttribute('data-theme') === 'day') {
      byId('ranking-basemap').src = 'map-day.png';
    }

    // Build the overlay geometry from ROUTE (runs once, before the timeline).
    var pts = ROUTE.split(' ').map(function (s) { var a = s.split(','); return [parseFloat(a[0]), parseFloat(a[1])]; });
    var dAttr = 'M' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' L');
    ['route-casing', 'route-core', 'sec1', 'sec2', 'sec3', 'sec4'].forEach(function (id) { byId(id).setAttribute('d', dAttr); });
    var core = byId('route-core');
    var L = core.getTotalLength();
    function at(len) { return core.getPointAtLength(Math.max(0, Math.min(L, len))); }
    var P0 = at(0), P1 = at(L);

    // Scored-sector overlays: one dash window per sector on a copy of the route path.
    var bounds = [0].concat(GATES).concat([1]);
    for (var s = 0; s < 4; s++) {
      var a = bounds[s] * L, b = bounds[s + 1] * L, el = byId('sec' + (s + 1));
      el.setAttribute('stroke-dasharray', (b - a) + ' ' + L);
      el.setAttribute('stroke-dashoffset', -a);
    }

    // Gates: 44-px tick perpendicular to the local heading, centred exactly on the route point.
    var GATE_PT = [];
    GATES.forEach(function (f, i) {
      var p = at(f * L), q1 = at(f * L - 8), q2 = at(f * L + 8);
      var ang = Math.atan2(q2.y - q1.y, q2.x - q1.x) + Math.PI / 2;
      var dx = Math.cos(ang) * 22, dy = Math.sin(ang) * 22;
      var g = byId('gate' + (i + 1));
      Array.prototype.forEach.call(g.querySelectorAll('line'), function (ln) {
        ln.setAttribute('x1', p.x - dx); ln.setAttribute('y1', p.y - dy);
        ln.setAttribute('x2', p.x + dx); ln.setAttribute('y2', p.y + dy);
      });
      GATE_PT.push(p);
    });

    gsap.set('#ring-start', { attr: { cx: P0.x, cy: P0.y } });
    gsap.set('#ring-end',   { attr: { cx: P1.x, cy: P1.y } });
    gsap.set('#rider',      { attr: { cx: P0.x, cy: P0.y } });

    // Rider along the route at constant speed: 240 short linear tweens (no callbacks, no plugins,
    // so a frame-seeking renderer always lands on the right point).
    function ride(tl, start, dur) {
      var N = 240, prev = at(0);
      for (var i = 1; i <= N; i++) {
        var p = at(i / N * L);
        tl.fromTo('#rider', { attr: { cx: prev.x, cy: prev.y } },
          { attr: { cx: p.x, cy: p.y }, duration: dur / N, ease: 'none', immediateRender: false, lazy: false },
          start + (i - 1) * dur / N);
        prev = p;
      }
    }

    var tl = gsap.timeline({ paused: true });

    // Frame 0: end of the second ride — every sector painted, gate ticks white (cycle 9), rider at the finish = gates-saving's last frame.
    gsap.set('.sector', { opacity: 1 });
    gsap.set('.gate', { opacity: 1 });
    gsap.set(['#ring-start', '#ring-end'], { opacity: 1 });
    gsap.set('#rider', { opacity: 1, attr: { cx: P1.x, cy: P1.y } });

    // Tower row ids, in slot order (slot 1 = trow-1 ... slot 10 = trow-10). trow-today is a purely
    // absolutely-positioned 11th row parked below slot 10 (top:600px) and stays opacity:0 (its base
    // .trow state) until Beat 2 reveals it and climbs it into slot 2 — never touched by the DOM,
    // never moved by a callback, only ever tweened, so frame-seeking always lands correctly (same
    // "no callbacks" discipline the rider tween above already relies on).
    var TOWER_ROWS = ['trow-1', 'trow-2', 'trow-3', 'trow-4', 'trow-5', 'trow-6', 'trow-7', 'trow-8', 'trow-9', 'trow-10'];

    // Beat 1 (0.0-0.7): map dims, timing tower fades in, then its ten rows (Mon...12 Aug) fill top-down.
    tl.to('#dim', { opacity: 0.7, duration: 0.5, ease: 'power1.inOut' }, 0.0);
    tl.fromTo('#tower', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    for (var r = 0; r < 10; r++) {
      tl.fromTo('#' + TOWER_ROWS[r], { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out' }, 0.80 + r * 0.15);
    }
    // hold 2.50-3.00

    // Beat 2 (3.0-5.4): "Today" climbs the tower. Old P10 (12 Aug / trow-10) fades out and drops
    // off the bottom first; Today emerges just below slot 10 (top:600px) and rides 540px up to
    // slot 2 in one continuous glide (power2.out, 2.2 s -- cycle 9: fast off the line, decelerating
    // into slot 2; was power1.inOut, which Nathan read as constant speed; total time unchanged).
    // Each row it overtakes steps down one slot (60px, this tower's row pitch), centred on the
    // moment Today crosses it. Step times are pre-computed from the climb's easing (power2.out
    // inverse: u = 1 - sqrt(1 - e)) — no callbacks, frame-seek safe.
    tl.to('#trow-10', { opacity: 0, y: 60, duration: 0.35, ease: 'power2.in' }, 3.00);
    var CLIMB_T0 = 3.20, CLIMB_DUR = 2.2;
    tl.fromTo('#trow-today', { y: 0 }, { y: -540, duration: CLIMB_DUR, ease: 'power2.out' }, CLIMB_T0);
    // Fade-in shortened 0.4 -> 0.25 with the new ease: Today now reaches row 9 at 3.39s and should be solid by then.
    tl.fromTo('#trow-today', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.out' }, CLIMB_T0);
    // Colour flip, not a fade: Today rides up white (same var(--ink) as every other
    // row) and turns green -- a P2 finish, not purple -- the instant it lands in
    // slot 2, same discrete "flip on completion" rule as the app's own sector strip.
    // Timed to the exact landing instant (also where the audio's green settle chime
    // fires), not before.
    tl.set('#trow-today .who, #trow-today .time', { color: '#00D000' }, CLIMB_T0 + CLIMB_DUR);
    // [row, start] — start = (CLIMB_T0 + u_cross * CLIMB_DUR) - 0.15, where u_cross is when Today's
    // top is half a slot below that row's top (Today at slot 10 pitch, rows at 60*(k-1)):
    // e_cross(k) = (570 - 60*(k-1)) / 540, u_cross = 1 - sqrt(1 - e_cross).
    var STEP_DOWN = [[9, 3.24], [8, 3.38], [7, 3.53], [6, 3.69], [5, 3.88], [4, 4.09], [3, 4.35], [2, 4.73]];
    STEP_DOWN.forEach(function (s) {
      tl.to('#trow-' + s[0], { y: 60, duration: 0.3, ease: 'power2.inOut' }, s[1]);
    });
